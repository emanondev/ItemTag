generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Command for Players only'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>You need to hold an item in hand'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>You lack of permission %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>You don''t have permission to use this command'
    prefix: "<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>"
    header-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Help</bold></#A78BFA>"
    header-sub-format: "<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Help</#55d6ff>"
    command-format: "<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>"
    footer-format: "%prev_clickable% <#7E9CFD><b>Help</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%"
    next_text: " <light_purple><b>><st>> ></st> "
    prev_text: " <light_purple><b><st>< <</st>< "
    next_void: " <dark_gray><b>><st>> ></st> "
    prev_void: " <dark_gray><b><st>< <</st>< "
    next_hover: "<gold><b>Go to page %target%"
    prev_hover: "<gold><b>Go to page %target%"
  wrong-alias:
    wrong-flag: '%prefix% <red>Wrong Flag Value! <dark_red>[<gold>hover here<dark_red>]'
    wrong-action: '%prefix% <red>Wrong Action Type! <dark_red>[<gold>hover here<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Aliases:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Toggle Custom flags on the item'
      - ''
      - '<yellow><flag> <gray>flag name'
      - '<yellow>[true/false] <gray>flag value, by default toggle'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>The item can be placed.'
        custom: '%prefix% <green>The item can''t be placed.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>You can''t place this item'
    usable:
      feedback:
        standard: '%prefix% <green>The item can be used.'
        custom: '%prefix% <green>The item can''t be used (Right click).'
    smelt:
      feedback:
        standard: '%prefix% <green>The item can be cooked/smelt on furnaces.'
        custom: '%prefix% <green>The item can''t be cooked/smelt on furnace.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>The item can be used as furnace fuel.'
        custom: '%prefix% <green>The item can''t be used as furnace fuel.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>The item can be used as recipe ingredient.'
        custom: '%prefix% <green>The item can''t be used as recipe ingredient.'
    enchantable:
      feedback:
        standard: '%prefix% <green>The item can be enchanted.'
        custom: '%prefix% <green>The item can''t be enchanted.'
    renamable:
      feedback:
        standard: '%prefix% <green>The item can be used on anvils.'
        custom: '%prefix% <green>The item can''t be used on anvils.'
    grindable:
      feedback:
        standard: '%prefix% <green>The item can be disenchanted with grindstone.'
        custom: '%prefix% <green>The item can''t be disenchanted with grindstone.'
    equipment:
      feedback:
        standard: '%prefix% <green>The item can be equipped.'
        custom: '%prefix% <green>The item can''t be equipped.'
    entityfood:
      feedback:
        standard: '%prefix% <green>The item can be used as animal''s food.'
        custom: '%prefix% <green>The item can''t be used as animal''s food.'
    clickmove:
      feedback:
        standard: '%prefix% <green>The item can be moved on inventory.'
        custom: '%prefix% <green>The item can''t be moved on inventory.'
    tradeable:
      feedback:
        standard: '%prefix% <green>The item can be traded with villagers.'
        custom: '%prefix% <green>The item can''t be traded with villagers.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>The item can be used as ingredient for smithing table.'
        custom: '%prefix% <green>The item can''t be used as ingredient for smithing table.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' is not a valid type <dark_red>[<gold>hover here<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' is not a valid info for <gold>%action% <dark_red>[<gold>hover here<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Sets actions done when the item is used'
      - ''
      - '<yellow>Add <type> <action> <gray>- add selected action'
      - '<yellow>Set <line> <type> <action> <gray>- replace action on chosen line'
      - '<yellow>Remove <line> <gray>- remove action on choosed line'
      - '<yellow>Clear <gray>- remove all actions'
      - '<yellow>Permission [permission] <gray>- set a required permission to use this item'
      - '<yellow>Cooldown <ms> <gray>- set a cooldown to use this item again'
      - '<yellow>Cooldownid [id] <gray>- set used cooldown id for this'
      - '<yellow>Cooldownmsg [msg] <gray>- set the cooldown feedback'
      - '<yellow>Cooldownmsgtype [type] <gray>- set the cooldown feedback type (chat or actionbar)'
      - '<yellow>Uses [amount] <gray>- set how many times this item can be used'
      - '<yellow>Info <gray>- show info abouth actions on current item'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Add selected action'
        - ''
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
      feedback: '%prefix% <green>Added <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Add selected action on selected line'
        - ''
        - '<yellow><line> <gray>line to add'
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
      feedback: '%prefix% <green>Line <yellow>%line% <green>added as <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Replace action on selected line'
        - ''
        - '<yellow><line> <gray>the line to replace'
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
      feedback: '%prefix% <green>Line <yellow>%line% <green>set as <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remove action on selected line'
        - ''
        - '<yellow><line> <gray>the line to remove'
      feedback: '%prefix% <green>Removed line <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Set permission to use this item'
        - ''
        - '<yellow>[permission] <gray>the permission to set, by default none'
      feedback:
        set: '%prefix% <green>Permission <yellow>%permission% <green>is now required to use this item'
        removed: '%prefix% <green>Now no permission is required to use this item'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown to use an item again'
        - ''
        - '<yellow>[ms] <gray>how much time before being able to use'
        - '     <gray>the item again, by default 0'
        - '<gray>Note: cooldown is set based on cooldownid, different'
        - '<gray>  items with same cooldownid share same cooldown'
        - '<gray>Note: cooldown is preserved on player logout and server restart'
      feedback:
        set: '%prefix% <green>This item has a cooldown of <yellow>%cooldown_seconds% <green>seconds'
        removed: '%prefix% <green>This item has no cooldown'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown id for an item'
        - ''
        - '<yellow>[id] <gray>how much time before being able to use the item again'
        - '<gray>Note: cooldown is set based on cooldownid, different'
        - '<gray>  items with same cooldownid share same cooldown'
      feedback:
        set: '%prefix% <green>This item use id <yellow>%id% <green>for cooldown'
        removed: '%prefix% <green>This item use <yellow>default <green>id for cooldown'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown message'
        - ''
        - '<yellow>[message] <gray>the message to show when the item can''t be used'
        - '  <gray>yet while the cooldown is active'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Feedback Message for cooldown set as ''<white>%msg%<green>'' when cooldown is active'
        removed: '%prefix% <green>Feedback Message for cooldown removed'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown message type'
        - ''
        - '<yellow>[type] <gray>chat or actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Feedback Message for cooldown set as type ''<yellow>%type%<green>'''
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Set how many times the item can be used'
        - ''
        - '<gray>Note: use <yellow>-1 <gray>for unlimited uses'
      feedback:
        set: '%prefix% <green>This item has <yellow>%uses% <green>uses before getting consumed'
        unlimited: '%prefix% <green>This item has <yellow>unlimited <green>uses'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Set max uses for the item'
        - ''
        - '<gray>Used mainly for aesthetic purposes with'
        - '<gray>display uses as true'
        - ''
        - '<gray>Note: use <yellow>-1 <gray>for unlimited uses'
      feedback:
        set: '%prefix% <green>This item has <yellow>%uses% <green>max uses'
        unlimited: '%prefix% <green>This item has <yellow>unlimited <green>max uses'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Consume the item on last use'
        - ''
        - '<gray>Note: when true and the item consume'
        - '<gray> it''s last use, the item is destroyed'
      feedback:
        set: '%prefix% <green>Item is destroyed upon reaching his last use'
        unset: '%prefix% <green>Item is not destroyed upon reaching his last use'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Visual display cooldown time left'
        - ''
        - '<gray>When true apply a cooldown effect similar to'
        - '<gray>ender pearls cooldown to the item'
        - ''
        - '<gray>Note: Unluckly this visual effect also'
        - '<gray> applies to any item of same kind'
      feedback:
        set: '%prefix% <green>Now item shows visual cooldown'
        unset: '%prefix% <green>Now item won''t show visual cooldown'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Display uses left'
        - ''
        - '<gray>When true adds a line to describe'
        - '<gray>how many uses are left'
        - ''
        - '<gray>Note: Unluckly this visual effect also'
        - '<gray> applies to any item of same kind'
      feedback:
        set: '%prefix% <green>Now item shows uses left and max uses'
        unset: '%prefix% <green>Now item won''t show uses left and max uses'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Sets an activity (some actions)'
      - '<gray>an activity may be activated by triggers'
      - '<gray>triggers may be associated to items (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- create a new activity'
      - '<yellow>Open <id> <gray>- open a gui for selected activity'
      - '<yellow>Delete <id> <gray>- delete selected activity'
      - '<yellow>Clone <id> <new id><gray>- clone selected activity'
      - '<yellow>Rename <id> <new id><gray>- rename selected activity'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Activity <gold>%id% <red>doesn''t exist'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Activity <gold>%id% <red>is already used'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Create a new activity'
        - ''
        - '<yellow><new id> <gray>is the id of the activity'
        - "  <gray>id must start with a letter and can be alphanumeric"
        - '  <gray>may also contains _ symbol'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>created'
    rename:
      params: "rename <id> <new id>"
      description:
        - '<gradient:#A78BFA:gold><b>Rename activity id'
        - ''
        - '<yellow><id> <gray>is the current id of the activity'
        - '<yellow><new id> <gray>is the new id of the activity'
        - "  <gray>id must start with a letter and can be alphanumeric"
        - '  <gray>may also contains _ symbol'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>renamed <yellow>%new_id%'
    open:
      params: "open <id>"
      description:
        - '<gradient:#A78BFA:gold><b>Open a gui to edit the activity'
        - ''
        - '<yellow><id> <gray>is the id of the activity'
    delete:
      params: "delete <id>"
      description:
        - '<gradient:#A78BFA:gold><b>Delete selected activity'
        - ''
        - '<yellow><id> <gray>is the id of the activity'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>deleted'
    clone:
      params: "clone <id> <clone id>"
      description:
        - '<gradient:#A78BFA:gold><b>Clone selected activity'
        - ''
        - '<yellow><id> <gray>is the id of the activity to clone'
        - '<yellow><clone id> <gray>is the id of the clone'
        - "  <gray>id must start with a letter and can be alphanumeric"
        - '  <gray>may also contains _ symbol'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>cloned to <yellow>%clone_id%'
    setconsumes:
      params: "setconsumes <id> <amount>"
      description:
        - '<gradient:#A78BFA:gold><b>Set uses required for selected activity'
        - ''
        - '<yellow><id> <gray>is the id of the activity to clone'
        - '<yellow><amount> <gray>amount of uses consumed by activity activation'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>uses consumption is <yellow>%amount%'
    addcondition:
      params: "addcondition <id> [!]<conditiontype> [condition info]"
      description:
        - '<gradient:#A78BFA:gold><b>Add a condition to activate the activity'
        - ''
        - '<yellow><id> <gray>is the id of the activity'
        - '<yellow>[!] <gray>is the ''!'' if you want the condition to be reversed'
        - '<yellow><conditiontype> <gray>is the type of condition'
        - '<yellow>[condition info] <gray>is additional information the condition type may need'
      feedback: '%prefix% <green>Activity <yellow>%id% <green>added condition <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>Sets actions done when the item is consumed like food and drinks'
      - ''
      - '<yellow>Add <type> <action> <gray>- add selected action'
      - '<yellow>Set <line> <type> <action> <gray>- replace action on chosen line'
      - '<yellow>Remove <line> <gray>- remove action on choosed line'
      - '<yellow>Clear <gray>- remove all actions'
      - '<yellow>Permission [permission] <gray>- set a required permission to consume this item'
      - '<yellow>Cooldown <ms> <gray>- set a cooldown to use this item again'
      - '<yellow>Cooldownid [id] <gray>- set used cooldown id for this'
      - '<yellow>Info <gray>- show info abouth actions on current item'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Add selected action'
        - ''
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Add selected action on selected line'
        - ''
        - '<yellow><line> <gray>line to add'
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Replace action on selected line'
        - ''
        - '<yellow><line> <gray>the line to replace'
        - '<yellow><type> <gray>type of action'
        - '<yellow><action> <gray>additional info for action'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remove action on selected line'
        - ''
        - '<yellow><line> <gray>the line to remove'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Set permission to consume this item'
        - ''
        - '<yellow>[permission] <gray>the permission to set, by default none'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown to consume an item again'
        - ''
        - '<yellow>[ms] <gray>how much time before being able to consume'
        - '     <gray>the item again, by default 0'
        - '<gray>Note: cooldown is set based on cooldownid, different'
        - '<gray>  items with same cooldownid share same cooldown'
        - '<gray>Note: cooldown is preserved on player logout and server restart'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Set a cooldown id for an item'
        - ''
        - '<yellow>[id] <gray>how much time before being able to consume the item again'
        - '<gray>Note: cooldown is set based on cooldownid, different'
        - '<gray>  items with same cooldownid share same cooldown'
    feedback:
      actions:
        set: '<green>Line <yellow>%line% <green>set as <yellow>%action%'
        remove: '<green>Removed line <yellow>%line% <green>(<yellow>%action%<green>)'
        clear: '<green>Cleared consume actions on this item'
        permission:
          set: '<green>Permission <yellow>%permission% <green>is now required to consume this item'
          removed: '<green>Now no permission is required to consume this item'
        cooldownid:
          set: '<green>This item use id <yellow>%id% <green>for cooldown'
          removed: '<green>This item use <yellow>default <green>id for cooldown'
        cooldown:
          set: '<green>This item has a cooldown of <yellow>%cooldown_seconds% <green>seconds'
          removed: '<green>This item has no cooldown'
  effects:
    description:
      - '<gradient:#A78BFA:gold><b>Add Permanent potion effects'
      - '<gray>Open a gui'
      - '<gray>Remember to select which equipment'
      - '<gray> slot apply the effect'
    params: ''
  usepermission:
    description:
      - '<gradient:#A78BFA:gold><b>Set a permission to use this item (right click vanilla behavior)'
      - ''
      - '<yellow>setpermission <permission> <gray>set required permission'
      - '<yellow>setmessage <message> <gray>set lack of permission message'
    params: '[...]'
    setpermission:
      feedback: "<green>Use permission is now set as <yellow>%value%"
      feedback-reset: "<green>Use required permission has been removed"
    setmessage:
      feedback: "<green>Use permission deny message is now set as <yellow>%value%"
      feedback-reset: "<green>Use permission deny message has been removed"
  wearpermission:
    description:
      - '<gradient:#A78BFA:gold><b>Set a permission to wear this item'
      - ''
      - '<gray>Attempting to wear the item will drop'
      - '<gray>it to inventory, or on floor if full'
      - '<gray>'
      - '<yellow>setpermission <permission> <gray>set required permission'
      - '<yellow>setmessage <message> <gray>set lack of permission message'
    params: '[...]'
    setpermission:
      feedback: "<green>Wear permission is now set as <yellow>%value%"
      feedback-reset: "<green>Wear required permission has been removed"
    setmessage:
      feedback: "<green>Wear permission deny message is now set as <yellow>%value%"
      feedback-reset: "<green>Use permission deny message has been removed"
  help:
    header-name: "ItemTag"
    description:
      - '<gradient:#A78BFA:gold><b>Shows ItemTag help</b></gradient>'
      - ''
      - '<gray><yellow>[page] </yellow>Help page'
      - '<gray><yellow>[subcommand] </yellow>Help for a subcommand'
    params: '[page/subcommand]'
itemtagreload:
  success: '<blue>[<white>ItemTag<blue>] <green>Reloaded'
gui:
  middleclick: #middle click can't be used unless on creative mode, an alternative to middle click is pressing hotbar button 1
    creative: 'Middle Click'
    other: 'Press 1'
  previous-page:
    #Holders: %player_name% %page% %target_page%
    description:
      - '<gold><bold>Previous Page'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Go to page <yellow>%target_page%'
  next-page:
    #Holders: %player_name% %page% %target_page%
    description:
      - '<gold><bold>Next Page'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Go to page <yellow>%target_page%'
  back:
    #Holders: %player_name%
    description:
      - '<gold><bold>Go Back'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Go to previous gui'
  actions:
    title: '<blue>Actions'
    click-interact: '<blue>[<white>ItemTag<blue>] <gray>[Click here]'
    click-hover: '<gold>Click to suggest command'
    addline:
      - '<gold><bold>Add Action'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Change values'
      - '<blue>/it actions add <action type> <action info>'
      - '<blue>/it actions addline <line> <action type> <action info>'
    set:
      - '<gold><bold>Set Action'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Change values'
      - '<blue>/it actions set <line> <action type> <action info>'
    remove:
      - '<gold><bold>Remove Action'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Change values'
      - '<blue>/it actions remove <line>'
    consume:
      - '<gold><bold>Consume on <yellow><bold>0<gold><bold> uses left'
      - '<gray>Enabled: <yellow>%value%'
      - '<gray>Note: when true and the item consume'
      - '<gray> it''s last use, the item is destroyed'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Toggle'
      - '<blue>/it actions consume [true/false]'
    uses:
      - '<gold><bold>Available Uses <yellow><bold>%value%'
      - '<gray>(-1 for Unlimited)'
      - ''
      - '<gray>[<white>Right Click<gray>]<gray> Add <yellow>%editor%'
      - '<gray>[<white>Left Click<gray>]<gray> Remove <yellow>%editor%'
      - '<gray>[<white>Shift Left/Right Click<gray>]<gray> %editor-prev% << <yellow>%editor% <gray>>> %editor-next%'
      - '<blue>/it actions uses <amount>'
    maxuses:
      - '<gold><bold>Max Uses <yellow><bold>%value%'
      - '<gray>(-1 for Unlimited)'
      - '<gray>Mainly used for aesthetic purpose with Display Uses'
      - ''
      - '<gray>[<white>Right Click<gray>]<gray> Add <yellow>%editor%'
      - '<gray>[<white>Left Click<gray>]<gray> Remove <yellow>%editor%'
      - '<gray>[<white>Shift Left/Right Click<gray>]<gray> %editor-prev% << <yellow>%editor% <gray>>> %editor-next%'
      - '<blue>/it actions maxuses <amount>'
    permission:
      - '<gold><bold>Permission to use: <yellow><bold>%value%'
      - '<gray>Note: if you don''t have this permission'
      - '<gray> you won''t be able to use the item or'
      - '<gray> decrease it''s uses'
      - ''
      - '<gray>[<white>Click<gray>]<gray> Edit'
      - '<blue>/it actions permission [permission]'
    cooldown:
      - '<gold><bold>Cooldown: <yellow><bold>%value_s% <blue>s'
      - '<gray>Note: apply a cooldown on right click uses'
      - ''
