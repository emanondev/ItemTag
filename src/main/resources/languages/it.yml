generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Comando disponibile solo ai giocatori'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Devi tenere un oggetto in mano'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>Non hai il permesso %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>Non hai il permesso per usare questo comando'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Aiuto</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Aiuto</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Aiuto</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Vai alla pagina %target%'
    prev_hover: '<gold><b>Vai alla pagina %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Valore del flag non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    wrong-action: '%prefix% <red>Tipo di azione non valido! <dark_red>[<gold>passa qui sopra<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Attiva/disattiva i flag personalizzati sull''oggetto'
      - ''
      - '<yellow><flag> <gray>nome del flag'
      - '<yellow>[true/false] <gray>valore del flag; se omesso, inverte il valore attuale'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere posizionato.'
        custom: '%prefix% <green>L''oggetto non può essere posizionato.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Non puoi posizionare questo oggetto'
    usable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato (clic destro).'
    smelt:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere cotto o fuso nelle fornaci.'
        custom: '%prefix% <green>L''oggetto non può essere cotto o fuso in una fornace.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato come combustibile per la fornace.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato come combustibile per la fornace.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato come ingrediente della ricetta.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato come ingrediente della ricetta.'
    enchantable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere incantato.'
        custom: '%prefix% <green>L''oggetto non può essere incantato.'
    renamable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato su un''incudine.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato sulle incudini.'
    grindable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere disincantato con la mola.'
        custom: '%prefix% <green>L''oggetto non può essere disincantato con la mola.'
    equipment:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere equipaggiato.'
        custom: '%prefix% <green>L''oggetto non può essere equipaggiato.'
    entityfood:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato come cibo per animali.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato come cibo per animali.'
    clickmove:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere spostato nell''inventario.'
        custom: '%prefix% <green>L''oggetto non può essere spostato nell''inventario.'
    tradeable:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere scambiato con gli villici.'
        custom: '%prefix% <green>L''oggetto non può essere scambiato con gli villici.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>L''oggetto può essere utilizzato come ingrediente per il banco da forgiatura.'
        custom: '%prefix% <green>L''oggetto non può essere utilizzato come ingrediente per il banco da forgiatura.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' non è un tipo valido <dark_red>[<gold>passa qui<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' non è un''informazione valida per <gold>%action% <dark_red>[<gold>passa qui<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Imposta le azioni eseguite quando l''oggetto viene utilizzato'
      - ''
      - '<yellow>Add <type> <action> <gray>- aggiungi l''azione selezionata'
      - '<yellow>Set <line> <type> <action> <gray>- sostituisce l''azione sulla riga scelta'
      - '<yellow>Remove <line> <gray>- rimuove l''azione sulla riga scelta'
      - '<yellow>Clear <gray>- rimuovi tutte le azioni'
      - '<yellow>Permission [permission] <gray>- imposta l''autorizzazione richiesta per utilizzare questo oggetto'
      - '<yellow>Cooldown <ms> <gray>- imposta un tempo di ricarica per utilizzare nuovamente questo oggetto'
      - '<yellow>Cooldownid [id] <gray>- imposta l''ID di ricarica utilizzato per questo'
      - '<yellow>Cooldownmsg [msg] <gray>- imposta il feedback del tempo di ricarica'
      - '<yellow>Cooldownmsgtype [type] <gray>- imposta il tipo di feedback del cooldown (chat o actionbar)'
      - '<yellow>Uses [amount] <gray>- imposta quante volte questo oggetto può essere utilizzato'
      - '<yellow>Info <gray>- mostra informazioni sulle azioni sull''oggetto corrente'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi l''azione selezionata'
        - ''
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
      feedback: '%prefix% <green>Azione aggiunta: <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi l''azione selezionata sulla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da aggiungere'
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
      feedback: '%prefix% <green>Riga <yellow>%line% <green>aggiunta come <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Sostituisci l''azione sulla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da sostituire'
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
      feedback: '%prefix% <green>Riga <yellow>%line% <green>impostata su <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Rimuovi l''azione dalla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da rimuovere'
      feedback: '%prefix% <green>Riga rimossa: <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta l''autorizzazione per utilizzare questo oggetto'
        - ''
        - '<yellow>[permission] <gray>l''autorizzazione da impostare, per impostazione predefinita nessuna'
      feedback:
        set: '%prefix% <green>Per utilizzare questo oggetto ora è necessaria l''autorizzazione <yellow>%permission% <green>'
        removed: '%prefix% <green>Ora non è richiesta alcuna autorizzazione per utilizzare questo oggetto'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un tempo di ricarica per utilizzare nuovamente un oggetto'
        - ''
        - '<yellow>[ms] <gray>quanto tempo prima di poterlo utilizzare'
        - '<gray>di nuovo l''oggetto, per impostazione predefinita 0'
        - '<gray>Nota: la ricarica dipende da cooldownid; oggetti diversi'
        - '<gray>  gli oggetti con lo stesso cooldownid condividono la stessa ricarica'
        - '<gray>Nota: il tempo di ricarica viene mantenuto alla disconnessione del giocatore e al riavvio del server'
      feedback:
        set: '%prefix% <green>Questo oggetto ha un tempo di ricarica di <yellow>%cooldown_seconds% <green>secondi'
        removed: '%prefix% <green>Questo oggetto non ha tempo di ricarica'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un ID di ricarica per un oggetto'
        - ''
        - '<yellow>[id] <gray>identificatore di ricarica condiviso'
        - '<gray>Nota: la ricarica dipende da cooldownid; oggetti diversi'
        - '<gray>  gli oggetti con lo stesso cooldownid condividono la stessa ricarica'
      feedback:
        set: '%prefix% <green>Questo oggetto utilizza l''ID <yellow>%id% <green>per il tempo di ricarica'
        removed: '%prefix% <green>Questo oggetto usa l''ID <yellow>predefinito <green>per la ricarica'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un messaggio di ricarica'
        - ''
        - '<yellow>[message] <gray>il messaggio da mostrare quando l''oggetto non può essere utilizzato'
        - '  <gray>perché la ricarica è ancora in corso'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Messaggio di feedback per il tempo di ricarica impostato come ''<white>%msg%<green>'' quando il tempo di ricarica è attivo'
        removed: '%prefix% <green>Messaggio di feedback per il tempo di ricarica rimosso'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un tipo di messaggio di ricarica'
        - ''
        - '<yellow>[type] <gray>chat o actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Messaggio di feedback per il tempo di ricarica impostato come tipo ''<yellow>%type%<green>'''
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta quante volte l''oggetto può essere utilizzato'
        - ''
        - '<gray>Nota: utilizzare <yellow>-1 <gray>per usi illimitati'
      feedback:
        set: '%prefix% <green>Questo oggetto ha <yellow>%uses% <green>usi prima di essere consumato'
        unlimited: '%prefix% <green>Questo oggetto ha <yellow> <green>usi illimitati'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta il numero massimo di utilizzi per l''oggetto'
        - ''
        - '<gray>Utilizzato principalmente per scopi estetici con'
        - '<gray>la visualizzazione degli utilizzi impostata su true'
        - ''
        - '<gray>Nota: utilizzare <yellow>-1 <gray>per usi illimitati'
      feedback:
        set: '%prefix% <green>Questo oggetto ha <yellow>%uses% <green>utilizzi massimi'
        unlimited: '%prefix% <green>Utilizzi massimi: <yellow>illimitati<green>'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Consuma l''oggetto all''ultimo utilizzo'
        - ''
        - '<gray>Nota: se impostato su true e l''oggetto esaurisce'
        - '<gray> il suo ultimo utilizzo, viene distrutto'
      feedback:
        set: '%prefix% <green>L''oggetto viene distrutto una volta raggiunto il suo ultimo utilizzo'
        unset: '%prefix% <green>L''oggetto non viene distrutto una volta raggiunto il suo ultimo utilizzo'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Mostra visivamente il tempo di ricarica rimanente'
        - ''
        - '<gray>Se impostato su true, mostra un''animazione simile a'
        - '<gray>quella di ricarica delle perle di ender'
        - ''
        - '<gray>Nota: purtroppo anche questo effetto visivo'
        - '<gray> si applica a qualsiasi oggetto dello stesso tipo'
      feedback:
        set: '%prefix% <green>Ora l''oggetto mostra il tempo di ricarica visivo'
        unset: '%prefix% <green>Ora l''oggetto non mostrerà il tempo di ricarica visivo'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Mostra gli utilizzi rimanenti'
        - ''
        - '<gray>Se impostato su true, aggiunge una riga che indica'
        - '<gray>quanti utilizzi rimangono'
        - ''
        - '<gray>Nota: purtroppo anche questo effetto visivo'
        - '<gray> si applica a qualsiasi oggetto dello stesso tipo'
      feedback:
        set: '%prefix% <green>L''oggetto ora mostra il numero di utilizzi rimanenti e massimi'
        unset: '%prefix% <green>L''oggetto non mostra più il numero di utilizzi rimanenti e massimi'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta un''attività (alcune azioni)'
      - '<gray>un''attività può essere attivata tramite trigger'
      - '<gray>I trigger possono essere associati agli oggetti (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- crea una nuova attività'
      - '<yellow>Open <id> <gray>- apre una GUI per l''attività selezionata'
      - '<yellow>Delete <id> <gray>- elimina l''attività selezionata'
      - '<yellow>Clone <id> <new id><gray>- clona l''attività selezionata'
      - '<yellow>Rename <id> <new id><gray>- rinomina l''attività selezionata'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>L''attività <gold>%id% <red>non esiste'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>L''attività <gold>%id% <red>è già utilizzata'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Crea una nuova attività'
        - ''
        - '<yellow><new id> <gray>è l''id dell''attività'
        - '<gray>id deve iniziare con una lettera e può essere alfanumerico'
        - '<gray>può contenere anche il simbolo _'
      feedback: '%prefix% <green>Attività <yellow>%id% <green>creata'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Rinomina ID attività'
        - ''
        - '<yellow><id> <gray>è l''ID corrente dell''attività'
        - '<yellow><new id> <gray>è il nuovo id dell''attività'
        - '<gray>id deve iniziare con una lettera e può essere alfanumerico'
        - '<gray>può contenere anche il simbolo _'
      feedback: '%prefix% <green>Attività <yellow>%id% <green>rinominata in <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Apri una GUI per modificare l''attività'
        - ''
        - '<yellow><id> <gray>è l''id dell''attività'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Elimina l''attività selezionata'
        - ''
        - '<yellow><id> <gray>è l''id dell''attività'
      feedback: '%prefix% <green>Attività <yellow>%id% <green>eliminata'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>Clona attività selezionata'
        - ''
        - '<yellow><id> <gray>è l''ID dell''attività selezionata'
        - '<yellow><clone id> <gray>è l''id del clone'
        - '<gray>id deve iniziare con una lettera e può essere alfanumerico'
        - '<gray>può contenere anche il simbolo _'
      feedback: '%prefix% <green>Attività <yellow>%id% <green>clonata in <yellow>%clone_id%'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta gli utilizzi richiesti dall''attività selezionata'
        - ''
        - '<yellow><id> <gray>è l''ID dell''attività selezionata'
        - '<yellow><amount> <gray>numero di utilizzi consumati all''attivazione dell''attività'
      feedback: '%prefix% <green>Utilizzi consumati dall''attività <yellow>%id% <green>: <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi una condizione per attivare l''attività'
        - ''
        - '<yellow><id> <gray>è l''id dell''attività'
        - '<yellow>[!] <gray>è il ''!'' se vuoi che la condizione venga invertita'
        - '<yellow><conditiontype> <gray>è il tipo di condizione'
        - '<yellow>[condition info] <gray>sono informazioni aggiuntive di cui il tipo di condizione potrebbe aver bisogno'
      feedback: '%prefix% <green>Attività <yellow>%id% <green>: condizione aggiunta <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta le azioni eseguite quando l''oggetto viene consumato come cibo e bevande'
      - ''
      - '<yellow>Add <type> <action> <gray>- aggiungi l''azione selezionata'
      - '<yellow>Set <line> <type> <action> <gray>- sostituisce l''azione sulla riga scelta'
      - '<yellow>Remove <line> <gray>- rimuove l''azione sulla riga scelta'
      - '<yellow>Clear <gray>- rimuovi tutte le azioni'
      - '<yellow>Permission [permission] <gray>- imposta l''autorizzazione richiesta per consumare questo oggetto'
      - '<yellow>Cooldown <ms> <gray>- imposta un tempo di ricarica per utilizzare nuovamente questo oggetto'
      - '<yellow>Cooldownid [id] <gray>- imposta l''ID di ricarica utilizzato per questo'
      - '<yellow>Info <gray>- mostra informazioni sulle azioni sull''oggetto corrente'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi l''azione selezionata'
        - ''
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Aggiungi l''azione selezionata sulla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da aggiungere'
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Sostituisci l''azione sulla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da sostituire'
        - '<yellow><type> <gray>tipo di azione'
        - '<yellow><action> <gray>informazioni aggiuntive per l''azione'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Rimuovi l''azione dalla riga selezionata'
        - ''
        - '<yellow><line> <gray>riga da rimuovere'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta l''autorizzazione per consumare questo oggetto'
        - ''
        - '<yellow>[permission] <gray>l''autorizzazione da impostare, per impostazione predefinita nessuna'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un tempo di ricarica per consumare nuovamente un oggetto'
        - ''
        - '<yellow>[ms] <gray>quanto tempo prima di poter consumare'
        - '<gray>di nuovo l''oggetto, per impostazione predefinita 0'
        - '<gray>Nota: la ricarica dipende da cooldownid; oggetti diversi'
        - '<gray>  gli oggetti con lo stesso cooldownid condividono la stessa ricarica'
        - '<gray>Nota: il tempo di ricarica viene mantenuto alla disconnessione del giocatore e al riavvio del server'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Imposta un ID di ricarica per un oggetto'
        - ''
        - '<yellow>[id] <gray>identificatore di ricarica condiviso'
        - '<gray>Nota: la ricarica dipende da cooldownid; oggetti diversi'
        - '<gray>  gli oggetti con lo stesso cooldownid condividono la stessa ricarica'
    feedback:
      actions:
        set: '<green>Riga <yellow>%line% <green>impostata su <yellow>%action%'
        remove: '<green>Riga rimossa: <yellow>%line% <green>(<yellow>%action%<green>)'
        clear: '<green>Azioni di consumo cancellate su questo oggetto'
        permission:
          set: '<green>Ora è necessaria l''autorizzazione <yellow>%permission% <green> per consumare questo oggetto'
          removed: '<green>Ora non è necessaria alcuna autorizzazione per consumare questo oggetto'
        cooldownid:
          set: '<green>Questo oggetto utilizza l''ID <yellow>%id% <green>per il tempo di ricarica'
          removed: '<green>Questo oggetto usa l''ID <yellow>predefinito <green>per la ricarica'
        cooldown:
          set: '<green>Questo oggetto ha un tempo di ricarica di <yellow>%cooldown_seconds% <green>secondi'
          removed: '<green>Questo oggetto non ha tempo di ricarica'
  effects:
    description:
      - '<gradient:#A78BFA:gold><b>Aggiungi effetti permanenti delle pozioni'
      - '<gray>Apri una GUI'
      - '<gray>Ricordati di selezionare lo slot di equipaggiamento'
      - '<gray> a cui applicare l''effetto'
    params: ''
  usepermission:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta il permesso per usare normalmente l''oggetto con il clic destro'
      - ''
      - '<yellow>setpermission <permission> <gray>imposta l''autorizzazione richiesta'
      - '<yellow>setmessage <message> <gray>imposta il messaggio di mancanza di autorizzazione'
    params: '[...]'
    setpermission:
      feedback: '<green>Il permesso di utilizzo è ora impostato su <yellow>%value%'
      feedback-reset: '<green>L''autorizzazione all''uso richiesta è stata rimossa'
    setmessage:
      feedback: '<green>Il messaggio di negazione dell''autorizzazione all''uso è ora impostato come <yellow>%value%'
      feedback-reset: '<green>Il messaggio di negazione del permesso di utilizzo è stato rimosso'
  wearpermission:
    description:
      - '<gradient:#A78BFA:gold><b>Imposta un''autorizzazione richiesta per equipaggiare questo oggetto'
