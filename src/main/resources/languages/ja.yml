generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>プレイヤー専用コマンド'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>アイテムを手に持つ必要があります'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>許可がありません %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>このコマンドを使用する権限がありません'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>ヘルプ</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>ヘルプ</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>ヘルプ</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>ページ%target%へ'
    prev_hover: '<gold><b>ページ%target%へ'
  wrong-alias:
    wrong-flag: '%prefix% <red>フラグ値が間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    wrong-action: '%prefix% <red>アクションのタイプが間違っています! <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>別名:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>アイテムのカスタムフラグを切り替えます'
      - ''
      - '<yellow><flag> <gray>フラグ名'
      - '<yellow>[true/false] <gray>フラグ値;省略した場合は、現在の値を反転します'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>アイテムを置くことができます。'
        custom: '%prefix% <green>商品を配置できません。'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>このアイテムは配置できません'
    usable:
      feedback:
        standard: '%prefix% <green>ご利用頂けます。'
        custom: '%prefix% <green>アイテムは使用できません（右クリック）。'
    smelt:
      feedback:
        standard: '%prefix% <green>このアイテムはかまどで調理または精錬することができます。'
        custom: '%prefix% <green>このアイテムはかまどで調理したり精錬したりすることはできません。'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>このアイテムは炉の燃料として使用できます。'
        custom: '%prefix% <green>このアイテムはかまどの燃料として使用できません。'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>このアイテムはレシピの材料として使用できます。'
        custom: '%prefix% <green>このアイテムはレシピの材料として使用できません。'
    enchantable:
      feedback:
        standard: '%prefix% <green>アイテムにはエンチャントを付けることができます。'
        custom: '%prefix% <green>このアイテムはエンチャントできません。'
    renamable:
      feedback:
        standard: '%prefix% <green>このアイテムは金床で使用できます。'
        custom: '%prefix% <green>このアイテムは金床では使用できません。'
    grindable:
      feedback:
        standard: '%prefix% <green>このアイテムは砥石で解呪できます。'
        custom: '%prefix% <green>このアイテムは砥石で解呪できません。'
    equipment:
      feedback:
        standard: '%prefix% <green>このアイテムは装備可能です。'
        custom: '%prefix% <green>このアイテムは装備できません。'
    entityfood:
      feedback:
        standard: '%prefix% <green>この商品は動物の餌として使用できます。'
        custom: '%prefix% <green>この商品は動物の餌として使用できません。'
    clickmove:
      feedback:
        standard: '%prefix% <green> アイテムはインベントリ内で移動できます。'
        custom: '%prefix% <green> このアイテムはインベントリ内で移動できません。'
    tradeable:
      feedback:
        standard: '%prefix% <green>このアイテムは村人と取引できます。'
        custom: '%prefix% <green>このアイテムは村人と取引できません。'
    smithing_table:
      feedback:
        standard: '%prefix% <green>このアイテムは鍛冶台の材料として使用できます。'
        custom: '%prefix% <green>このアイテムは鍛冶台の材料として使用できません。'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' は有効なタイプではありません <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>「<gold>%error%<red>」は、<gold>%action% <dark_red>[<gold>ここにカーソルを合わせてください<dark_red>] にとって有効な情報ではありません'
    description:
      - '<gradient:#A78BFA:gold><b>アイテム使用時のアクションを設定します'
      - ''
      - '<yellow>Add <type> <action> <gray>- 選択したアクションを追加'
      - '<yellow>Set <line> <type> <action> <gray>- 選択した行のアクションを置換します'
      - '<yellow>Remove <line> <gray>- 選択した行のアクションを削除します'
      - '<yellow>Clear <gray>- すべてのアクションを削除します'
      - '<yellow>Permission [permission] <gray> - このアイテムを使用するために必要な権限を設定します'
      - '<yellow>Cooldown <ms> <gray> - このアイテムを再度使用するにはクールダウンを設定してください'
      - '<yellow>Cooldownid [id] <gray> - これに使用されるクールダウン ID を設定します'
      - '<yellow>Cooldownmsg [msg] <gray> - クールダウンフィードバックを設定します'
      - '<yellow>Cooldownmsgtype [type] <gray> - クールダウンフィードバックのタイプを設定します (chat または actionbar)'
      - '<yellow>Uses [amount] <gray> - このアイテムを使用できる回数を設定します'
      - '<yellow>Info <gray> - 現在のアイテムに対するアクションに関する情報を表示します'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクションを追加'
        - ''
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
      feedback: '%prefix% <green>追加 <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクションを選択した行に追加します'
        - ''
        - '<yellow><line> <gray>行追加'
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
      feedback: '%prefix% <green>行 <yellow>%line% <green> を <yellow>%action% として追加'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のアクションを置換'
        - ''
        - '<yellow><line> <gray>置換する行'
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
      feedback: '%prefix% <green>行<yellow>%line% <green>を<yellow>%action%に設定'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のアクションを削除'
        - ''
        - '<yellow><line> <gray>削除する行'
      feedback: '%prefix% <green>行を削除 <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>このアイテムの使用許可を設定します'
        - ''
        - '<yellow>[permission] <gray>設定する権限、デフォルトではなし'
      feedback:
        set: '%prefix% <green>許可 <yellow>%permission% <green> が必要です'
        removed: '%prefix% <green>このアイテムを使用するのに許可は必要ありません'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムを再度使用するにはクールダウンを設定します'
        - ''
        - '<yellow>[ms] <gray>使用できるようになるまでの時間'
        - '<gray>アイテムを再度、デフォルトでは 0'
        - '<gray>注: クールダウンはcooldownidに基づいて設定されており、異なります'
        - '<gray>  同じアイテム cooldownid 同じクールダウンを共有する'
        - '<gray>注: クールダウンはプレーヤーのログアウトとサーバーの再起動時に保持されます'
      feedback:
        set: '%prefix% <green>このアイテムのクールタイムは<yellow>%cooldown_seconds% <green>秒です'
        removed: '%prefix% <green>このアイテムにはクールダウンはありません'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムのクールダウン ID を設定する'
        - ''
        - '<yellow>[id] <gray>共有クールダウン識別子'
        - '<gray>注: クールダウンはcooldownidに基づいて設定されており、異なります'
        - '<gray>  同じアイテム cooldownid 同じクールダウンを共有する'
      feedback:
        set: '%prefix% <green>このアイテムはクールダウンに ID <yellow>%id% <green> を使用します'
        removed: '%prefix% <green>このアイテムはクールダウンに<yellow>デフォルト<green>IDを使用します'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>クールダウンメッセージを設定する'
        - ''
        - '<yellow>[message] <gray>アイテムが使用できないときに表示されるメッセージ'
        - '<gray>'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>クールダウンがアクティブな場合、クールダウンのフィードバックメッセージが「<white>%msg%<green>」に設定されます'
        removed: '%prefix% <green>クールダウンのフィードバックメッセージが削除されました'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>クールダウンメッセージの種類を設定します'
        - ''
        - '<yellow>[type] <gray>chat または actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>クールダウンのフィードバック メッセージがタイプ「<yellow>%type%<green>」として設定されました'
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムの使用回数を設定します'
        - ''
        - '<gray>注: 無制限に使用するには <yellow>-1 <gray> を使用してください'
      feedback:
        set: '%prefix% <green>このアイテムは消費されるまでに <yellow>%uses% <green>回使用されます'
        unlimited: '%prefix% <green>このアイテムは <yellow>無制限 <green>使用できます'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムの最大使用回数を設定します'
        - ''
        - '<gray>主に美的目的で使用されます'
        - '<gray> true に設定されたディスプレイを使用します'
        - ''
        - '<gray>注: 無制限に使用するには <yellow>-1 <gray> を使用してください'
      feedback:
        set: '%prefix% <green>このアイテムの使用回数は <yellow>%uses% <green> までです'
        unlimited: '%prefix% <green>このアイテムは <yellow>無制限 <green>最大使用可能です'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>最後の使用時にアイテムを消費する'
        - ''
        - '<gray>注: true とアイテムが消費されたとき'
        - '<gray> 最後に使用した場合、アイテムは破棄されます'
      feedback:
        set: '%prefix% <green>アイテムは最後の使用に達すると破棄されます'
        unset: '%prefix% <green>アイテムは最後に使用しても破壊されません'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>残りのクールダウンを視覚的に表示します'
        - ''
        - '<gray>true の場合、アイテムには次のようなアニメーションが表示されます。'
        - '<gray>エンダーパールのクールダウンアニメーション'
        - ''
        - '<gray>注: 残念ながら、この視覚効果も'
        - '<gray> は同じ種類のアイテムに適用されます'
      feedback:
        set: '%prefix% <green>アイテムに視覚的なクールダウンが表示されるようになりました'
        unset: '%prefix% <green>アイテムに視覚的なクールダウンが表示されなくなりました'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>残り使用回数を表示'
        - ''
        - '<gray>true が説明する行を追加するとき'
        - '<gray>あと何回使用できますか'
        - ''
        - '<gray>注: 残念ながら、この視覚効果も'
        - '<gray> は同じ種類のアイテムに適用されます'
      feedback:
        set: '%prefix% <green>アイテムの残り使用回数と最大使用回数が表示されるようになりました'
        unset: '%prefix% <green>アイテムの残り使用回数と最大使用回数が表示されなくなりました'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>アクティビティ（一部のアクション）を設定します'
      - '<gray>アクティビティはトリガーによってアクティブ化される場合があります'
      - '<gray> トリガーをアイテム (/it trigger) に関連付けることができます'
      - ''
      - '<yellow>Create <id> <gray>- 新しいアクティビティを作成します'
      - '<yellow>Open <id> <gray> - 選択したアクティビティの GUI を開きます'
      - '<yellow>Delete <id> <gray> - 選択したアクティビティを削除します'
      - '<yellow>Clone <id> <new id><gray>- 選択したアクティビティのクローンを作成します'
      - '<yellow>Rename <id> <new id><gray>- 選択したアクティビティの名前を変更します'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>アクティビティ <gold>%id% <red> は存在しません'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>アクティビティ <gold>%id% <red> はすでに使用されています'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>新しいアクティビティを作成する'
        - ''
        - '<yellow><new id> <gray> はアクティビティの ID です'
        - '<gray>id は文字で始まる必要があり、英数字を使用できます'
        - '<gray>には_記号も含まれる場合があります'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green> が作成されました'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>アクティビティ ID の名前を変更'
        - ''
        - '<yellow><id> <gray> はアクティビティの現在の ID です'
        - '<yellow><new id> <gray> はアクティビティの新しい ID です'
        - '<gray>id は文字で始まる必要があり、英数字を使用できます'
        - '<gray>には_記号も含まれる場合があります'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green>名前変更 <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>GUIを開いてアクティビティを編集します'
        - ''
        - '<yellow><id> <gray> はアクティビティの ID です'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクティビティを削除'
        - ''
        - '<yellow><id> <gray> はアクティビティの ID です'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green>削除されました'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクティビティのクローンを作成します'
        - ''
        - '<yellow><id> <gray>は選択したアクティビティのIDです'
        - '<yellow><clone id> <gray> はクローンの ID です'
        - '<gray>id は文字で始まる必要があり、英数字を使用できます'
        - '<gray>には_記号も含まれる場合があります'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green> が <yellow>%clone_id% にクローンされました'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクティビティに必要な用途を設定します'
        - ''
        - '<yellow><id> <gray>は選択したアクティビティのIDです'
        - '<yellow><amount> <gray>アクティビティのアクティベーションによって消費された使用量'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green> の消費量は <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>アクティビティをアクティブ化する条件を追加します'
        - ''
        - '<yellow><id> <gray> はアクティビティの ID です'
        - '<yellow>[!] <gray> は「!」です。条件を元に戻したい場合は'
        - '<yellow><conditiontype> <gray> は条件のタイプです'
        - '<yellow>[condition info] <gray>は、条件タイプに必要な追加情報です'
      feedback: '%prefix% <green>アクティビティ <yellow>%id% <green>追加条件 <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>食べ物や飲み物などのアイテムが消費されたときに実行されるアクションを設定します'
      - ''
      - '<yellow>Add <type> <action> <gray>- 選択したアクションを追加'
      - '<yellow>Set <line> <type> <action> <gray>- 選択した行のアクションを置換します'
      - '<yellow>Remove <line> <gray>- 選択した行のアクションを削除します'
      - '<yellow>Clear <gray>- すべてのアクションを削除します'
      - '<yellow>Permission [permission] <gray> - このアイテムを消費するために必要な権限を設定します'
      - '<yellow>Cooldown <ms> <gray> - このアイテムを再度使用するにはクールダウンを設定してください'
      - '<yellow>Cooldownid [id] <gray> - これに使用されるクールダウン ID を設定します'
      - '<yellow>Info <gray> - 現在のアイテムに対するアクションに関する情報を表示します'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクションを追加'
        - ''
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択したアクションを選択した行に追加します'
        - ''
        - '<yellow><line> <gray>行追加'
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のアクションを置換'
        - ''
        - '<yellow><line> <gray>置換する行'
        - '<yellow><type> <gray>アクションの種類'
        - '<yellow><action> <gray>アクションに関する追加情報'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>選択した行のアクションを削除'
        - ''
        - '<yellow><line> <gray>削除する行'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>このアイテムを消費する権限を設定します'
        - ''
        - '<yellow>[permission] <gray>設定する権限、デフォルトではなし'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムを再度消費するにはクールダウンを設定します'
        - ''
        - '<yellow>[ms] <gray>消費できるようになるまでの時間'
        - '<gray>アイテムを再度、デフォルトでは 0'
        - '<gray>注: クールダウンはcooldownidに基づいて設定されており、異なります'
        - '<gray>  同じアイテム cooldownid 同じクールダウンを共有する'
        - '<gray>注: クールダウンはプレーヤーのログアウトとサーバーの再起動時に保持されます'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>アイテムのクールダウン ID を設定する'
        - ''
        - '<yellow>[id] <gray>共有クールダウン識別子'
        - '<gray>注: クールダウンはcooldownidに基づいて設定されており、異なります'
        - '<gray>  同じアイテム cooldownid 同じクールダウンを共有する'
