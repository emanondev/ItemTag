generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>플레이어 전용 명령'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>아이템을 손에 들고 있어야 합니다'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>권한이 없습니다 %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>이 명령을 사용할 권한이 없습니다.'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>도움말</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>도움말</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>도움말</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>페이지로 이동 %target%'
    prev_hover: '<gold><b>페이지로 이동 %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>플래그 값이 잘못되었습니다! <dark_red>[<gold>여기에 마우스를 올리세요<dark_red>]'
    wrong-action: '%prefix% <red>작업 유형이 잘못되었습니다! <dark_red>[<gold>여기로 마우스를 가져가세요<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>별칭:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>아이템에 맞춤 플래그 전환'
      - ''
      - '<yellow><flag> <gray>플래그 이름'
      - '<yellow>[true/false] <gray>플래그 값; 생략하면 현재 값을 반전시킵니다.'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>아이템을 배치할 수 있습니다.'
        custom: '%prefix% <green>아이템을 배치할 수 없습니다.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>이 아이템을 배치할 수 없습니다'
    usable:
      feedback:
        standard: '%prefix% <green>아이템을 사용할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템을 사용할 수 없습니다(오른쪽 클릭).'
    smelt:
      feedback:
        standard: '%prefix% <green>이 아이템은 화로에서 요리하거나 제련할 수 있습니다.'
        custom: '%prefix% <green>이 아이템은 화로에서 요리하거나 제련할 수 없습니다.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>이 아이템은 화로 연료로 사용할 수 있습니다.'
        custom: '%prefix% <green>이 아이템은 화로 연료로 사용할 수 없습니다.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>해당 아이템은 레시피 재료로 사용할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템은 레시피 재료로 사용할 수 없습니다.'
    enchantable:
      feedback:
        standard: '%prefix% <green>아이템에 마법을 부여할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템에는 마법을 부여할 수 없습니다.'
    renamable:
      feedback:
        standard: '%prefix% <green>해당 아이템은 모루에 사용할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템은 모루에 사용할 수 없습니다.'
    grindable:
      feedback:
        standard: '%prefix% <green> 해당 아이템은 숫돌로 마력을 추출할 수 있습니다.'
        custom: '%prefix% <green> 해당 아이템은 숫돌로 마력을 추출할 수 없습니다.'
    equipment:
      feedback:
        standard: '%prefix% <green>아이템을 장착할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템은 장착할 수 없습니다.'
    entityfood:
      feedback:
        standard: '%prefix% <green>동물의 먹이로 사용할 수 있는 아이템입니다.'
        custom: '%prefix% <green>동물사료로 사용할 수 없는 아이템입니다.'
    clickmove:
      feedback:
        standard: '%prefix% <green>해당 아이템은 인벤토리에서 이동할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템은 인벤토리 내에서 이동할 수 없습니다.'
    tradeable:
      feedback:
        standard: '%prefix% <green>해당 아이템은 마을 주민들과 거래할 수 있습니다.'
        custom: '%prefix% <green>해당 아이템은 주민과 거래할 수 없습니다.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>이 아이템은 대장간 테이블의 재료로 사용할 수 있습니다.'
        custom: '%prefix% <green>이 아이템은 대장간 테이블 재료로 사용할 수 없습니다.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>''은(는) 유효한 유형이 아닙니다. <dark_red>[<gold>여기에 마우스를 올리세요<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>''은 <gold>%action% <dark_red>[<gold>여기<dark_red>]에 대한 유효한 정보가 아닙니다.'
    description:
      - '<gradient:#A78BFA:gold><b>아이템 사용 시 수행되는 동작을 설정합니다.'
      - ''
      - '<yellow>Add <type> <action> <gray>- 선택한 작업 추가'
      - '<yellow>Set <line> <type> <action> <gray>- 선택한 줄의 작업 바꾸기'
      - '<yellow>Remove <line> <gray>- 선택한 라인에서 작업 제거'
      - '<yellow>Clear <gray>- 모든 작업 제거'
      - '<yellow>Permission [permission] <gray>- 이 아이템을 사용하는 데 필요한 권한을 설정하세요'
      - '<yellow>Cooldown <ms> <gray>- 이 아이템을 다시 사용하려면 쿨타임을 설정하세요'
      - '<yellow>Cooldownid [id] <gray>- 이에 대해 사용된 쿨다운 ID를 설정합니다.'
      - '<yellow>Cooldownmsg [msg] <gray>- 쿨다운 피드백 설정'
      - '<yellow>Cooldownmsgtype [type] <gray> - 쿨다운 피드백 유형 설정(chat 또는 actionbar)'
      - '<yellow>Uses [amount] <gray>- 이 아이템을 몇 번이나 사용할 수 있는지 설정'
      - '<yellow>Info <gray>- 현재 아이템에 대한 작업 정보 표시'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 작업 추가'
        - ''
        - '<yellow><type> <gray>행동 유형'
        - '<yellow><action> <gray>작업에 대한 추가 정보'
      feedback: '%prefix% <green>추가됨 <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 줄에 선택한 작업 추가'
        - ''
        - '<yellow><line> <gray> 추가할 줄'
        - '<yellow><type> <gray>행동 유형'
        - '<yellow><action> <gray>작업에 대한 추가 정보'
      feedback: '%prefix% <green>라인 <yellow>%line% <green>이 <yellow>%action%로 추가됨'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 줄의 작업 바꾸기'
        - ''
        - '<yellow><line> <gray> 교체할 줄'
        - '<yellow><type> <gray>행동 유형'
        - '<yellow><action> <gray>작업에 대한 추가 정보'
      feedback: '%prefix% <green>라인 <yellow>%line% <green>을 <yellow>%action%로 설정'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 줄에서 작업 제거'
        - ''
        - '<yellow><line> <gray>제거할 줄'
      feedback: '%prefix% <green>삭제된 줄 <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>이 아이템 사용 권한 설정'
        - ''
        - '<yellow>[permission] <gray>권한 설정, 기본적으로 없음'
      feedback:
        set: '%prefix% <green>권한 <yellow>%permission% <green>이 이제 이 아이템을 사용하는 데 필요합니다.'
        removed: '%prefix% <green>이제 이 아이템을 사용하는 데 권한이 필요하지 않습니다.'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>아이템을 다시 사용하려면 재사용 대기시간을 설정하세요.'
        - ''
        - '<yellow>[ms] <gray>사용 가능까지 시간이 얼마나 소요됩니까?'
        - '<gray>아이템을 다시 기본적으로 0'
        - '<gray>참고: 재사용 대기시간은 cooldownid에 따라 설정됩니다.'
        - '<gray> 동일한 아이템 cooldownid 동일한 재사용 대기시간 공유'
        - '<gray>참고: 플레이어 로그아웃 및 서버 재시작 시 재사용 대기시간이 유지됩니다.'
      feedback:
        set: '%prefix% <green>이 아이템의 재사용 대기시간은 <yellow>%cooldown_seconds% <green>초입니다.'
        removed: '%prefix% <green>이 아이템에는 재사용 대기시간이 없습니다.'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>아이템의 쿨다운 ID 설정'
        - ''
        - '<yellow>[id] <gray>공유 재사용 대기시간 식별자'
        - '<gray>참고: 재사용 대기시간은 cooldownid에 따라 설정됩니다.'
        - '<gray> 동일한 아이템 cooldownid 동일한 재사용 대기시간 공유'
      feedback:
        set: '%prefix% <green>이 아이템은 재사용 대기시간으로 ID <yellow>%id% <green>를 사용합니다.'
        removed: '%prefix% <green>이 아이템은 재사용 대기시간에 <yellow>기본 <green>id를 사용합니다.'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>쿨다운 메시지 설정'
        - ''
        - '<yellow>[message] <gray>아이템을 사용할 수 없을 때 표시되는 메시지'
        - '<gray>아직 재사용 대기시간이 활성화된 동안'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>쿨다운이 활성화되면 ''<white>%msg%<green>''로 설정된 쿨다운에 대한 피드백 메시지'
        removed: '%prefix% <green>쿨타임에 대한 피드백 메시지가 삭제되었습니다.'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>대기시간 메시지 유형 설정'
        - ''
        - '<yellow>[type] <gray>chat 또는 actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>''<yellow>%type%<green>'' 유형으로 설정된 재사용 대기시간에 대한 피드백 메시지'
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>아이템 사용 횟수 설정'
        - ''
        - '<gray>참고: 무제한 사용하려면 <yellow>-1 <gray>를 사용하세요.'
      feedback:
        set: '%prefix% <green>이 아이템은 소모되기 전까지 <yellow>%uses% <green>사용 횟수가 있습니다'
        unlimited: '%prefix% <green>이 아이템에는 <yellow>무제한 <green> 용도가 있습니다.'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>아이템의 최대 사용 횟수 설정'
        - ''
        - '<gray>주로 미적 목적으로 사용됩니다.'
        - '<gray>디스플레이 사용이 true로 설정됨'
        - ''
        - '<gray>참고: 무제한 사용하려면 <yellow>-1 <gray>를 사용하세요.'
      feedback:
        set: '%prefix% <green>이 아이템의 최대 사용 횟수는 <yellow>%uses% <green>입니다.'
        unlimited: '%prefix% <green>이 아이템은 <yellow>무제한 <green>최대 사용 가능'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>마지막 사용 시 아이템 소모'
        - ''
        - '<gray>참고: true 및 아이템이 소모될 때'
        - '<gray> 마지막으로 사용하면 아이템이 파괴됩니다.'
      feedback:
        set: '%prefix% <green>아이템은 마지막 사용 시 폐기됩니다.'
        unset: '%prefix% <green>아이템은 마지막 사용 후에도 파괴되지 않습니다.'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>남은 재사용 대기시간을 시각적으로 표시'
        - ''
        - '<gray> true 때 아이템이 다음과 유사한 애니메이션을 표시합니다.'
        - '<gray>엔더 진주의 재사용 대기시간 애니메이션'
        - ''
        - '<gray>참고: 안타깝게도 이 시각 효과도'
        - '<gray> 같은 종류의 모든 품목에 적용됩니다.'
      feedback:
        set: '%prefix% <green>이제 아이템에 시각적 쿨다운이 표시됩니다.'
        unset: '%prefix% <green>이제 아이템에 시각적 재사용 대기시간이 표시되지 않습니다.'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>남은 사용 횟수 표시'
        - ''
        - '<gray> true가 설명하는 줄을 추가하는 경우'
        - '<gray>사용 횟수가 얼마나 남았나요?'
        - ''
        - '<gray>참고: 안타깝게도 이 시각 효과도'
        - '<gray> 같은 종류의 모든 품목에 적용됩니다.'
      feedback:
        set: '%prefix% <green> 이제 아이템에 남은 사용 횟수와 최대 사용 횟수가 표시됩니다.'
        unset: '%prefix% <green>아이템에 더 이상 남은 사용 횟수와 최대 사용 횟수가 표시되지 않습니다.'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>활동 설정(일부 동작)'
      - '<gray>트리거에 의해 활동이 활성화될 수 있습니다.'
      - '<gray>트리거가 아이템과 연결될 수 있음(/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- 새 활동 만들기'
      - '<yellow>Open <id> <gray>- 선택한 활동에 대한 GUI 열기'
      - '<yellow>Delete <id> <gray>- 선택한 활동 삭제'
      - '<yellow>Clone <id> <new id><gray>- 선택한 활동 복제'
      - '<yellow>Rename <id> <new id><gray>- 선택한 활동의 이름 바꾸기'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>활동 <gold>%id% <red>이 존재하지 않습니다'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>활동 <gold>%id% <red>은 이미 사용되었습니다.'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>새 활동 만들기'
        - ''
        - '<yellow><new id> <gray>는 활동의 ID입니다.'
        - '<gray>id는 문자로 시작해야 하며 영숫자일 수 있습니다.'
        - '<gray> _ 기호도 포함될 수 있음'
      feedback: '%prefix% <green>활동 <yellow>%id% <green>생성됨'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>활동 ID 이름 바꾸기'
        - ''
        - '<yellow><id> <gray>는 활동의 현재 ID입니다.'
        - '<yellow><new id> <gray>는 활동의 새 ID입니다.'
        - '<gray>id는 문자로 시작해야 하며 영숫자일 수 있습니다.'
        - '<gray> _ 기호도 포함될 수 있음'
      feedback: '%prefix% <green>활동 <yellow>%id% <green>이름이 변경됨 <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>GUI를 열어 활동을 편집하세요.'
        - ''
        - '<yellow><id> <gray>는 활동의 ID입니다.'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 활동 삭제'
        - ''
        - '<yellow><id> <gray>는 활동의 ID입니다.'
      feedback: '%prefix% <green>활동 <yellow>%id% <green>삭제됨'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 활동 복제'
        - ''
        - '<yellow><id> <gray>는 선택한 활동의 ID입니다.'
        - '<yellow><clone id> <gray>은 클론의 ID입니다.'
        - '<gray>id는 문자로 시작해야 하며 영숫자일 수 있습니다.'
        - '<gray> _ 기호도 포함될 수 있음'
      feedback: '%prefix% <green>활동 <yellow>%id% <green>이 <yellow>%clone_id%에 복제되었습니다.'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>선택한 활동에 필요한 용도 설정'
        - ''
        - '<yellow><id> <gray>는 선택한 활동의 ID입니다.'
        - '<yellow><amount> <gray>활동 활성화에 따른 사용 횟수'
      feedback: '%prefix% <green>활동 <yellow>%id% <green>사용 소비는 <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
