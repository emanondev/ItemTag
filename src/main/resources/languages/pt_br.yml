generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Comando apenas para jogadores'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Você precisa segurar um item em mãos'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>Você não tem permissão %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>Você não tem permissão para usar este comando'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Ajuda</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Ajuda</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Ajuda</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: '<light_purple><b>><st>> ></st>'
    prev_text: '<light_purple><b><st>< <</st><'
    next_void: '<dark_gray><b>><st>> ></st>'
    prev_void: '<dark_gray><b><st>< <</st><'
    next_hover: '<gold><b>Vá para a página %target%'
    prev_hover: '<gold><b>Vá para a página %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Valor de indicador inválido! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    wrong-action: '%prefix% <red>Tipo de ação errado! <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Alias:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Alternar os indicadores personalizados do item'
      - ''
      - '<yellow><flag> <gray>nome do indicador'
      - '<yellow>[true/false] <gray>valor do indicador; se omitido, alterna o valor atual'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>O item pode ser colocado.'
        custom: '%prefix% <green>O item não pode ser colocado.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Você não pode colocar este item'
    usable:
      feedback:
        standard: '%prefix% <green>O item pode ser usado.'
        custom: '%prefix% <green>O item não pode ser usado (clique com o botão direito).'
    smelt:
      feedback:
        standard: '%prefix% <green>O item pode ser cozido/fundido em fornos.'
        custom: '%prefix% <green>O item não pode ser cozido/fundido no forno.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>O item pode ser usado como combustível de fornalha.'
        custom: '%prefix% <green>O item não pode ser usado como combustível de fornalha.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>O item pode ser usado como ingrediente de receita.'
        custom: '%prefix% <green>O item não pode ser usado como ingrediente de receita.'
    enchantable:
      feedback:
        standard: '%prefix% <green>O item pode ser encantado.'
        custom: '%prefix% <green>O item não pode ser encantado.'
    renamable:
      feedback:
        standard: '%prefix% <green>O item pode ser usado em bigornas.'
        custom: '%prefix% <green>O item não pode ser usado em bigornas.'
    grindable:
      feedback:
        standard: '%prefix% <green>O item pode ser desencantado com rebolo.'
        custom: '%prefix% <green>O item não pode ser desencantado com rebolo.'
    equipment:
      feedback:
        standard: '%prefix% <green>O item pode ser equipado.'
        custom: '%prefix% <green>O item não pode ser equipado.'
    entityfood:
      feedback:
        standard: '%prefix% <green>O item pode ser usado como alimento para animais.'
        custom: '%prefix% <green>O item não pode ser usado como alimento para animais.'
    clickmove:
      feedback:
        standard: '%prefix% <green>O item pode ser movido no inventário.'
        custom: '%prefix% <green>O item não pode ser movido no inventário.'
    tradeable:
      feedback:
        standard: '%prefix% <green>O item pode ser negociado com os aldeões.'
        custom: '%prefix% <green>O item não pode ser negociado com aldeões.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>O item pode ser usado como ingrediente para mesa de forja.'
        custom: '%prefix% <green>O item não pode ser usado como ingrediente para mesa de forja.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' não é um tipo válido <dark_red>[<gold> passe o mouse aqui<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' não é uma informação válida para <gold>%action% <dark_red>[<gold>passe o mouse aqui<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Define ações realizadas quando o item é usado'
      - ''
      - '<yellow>Adicionar <type> <action> <gray>- adicionar ação selecionada'
      - '<yellow>Set <line> <type> <action> <gray>- substitui a ação na linha escolhida'
      - '<yellow>Remover <line> <gray>- remover ação na linha escolhida'
      - '<yellow>Limpar <gray>- remover todas as ações'
      - '<yellow>Permissão [permissão] <gray>- defina uma permissão necessária para usar este item'
      - '<yellow>Cooldown <ms> <gray>- defina um cooldown para usar este item novamente'
      - '<yellow>Cooldownid [id] <gray>- definir o ID de cooldown usado para isso'
      - '<yellow>Cooldownmsg [msg] <gray>- definir o feedback do resfriamento'
      - '<yellow>Cooldownmsgdigite [type] <gray>- define o tipo de feedback de resfriamento (chat ou actionbar)'
      - '<yellow>Usa [quantidade] <gray>- defina quantas vezes este item pode ser usado'
      - '<yellow>Info <gray>- mostra informações sobre ações no item atual'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar ação selecionada'
        - ''
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
      feedback: '%prefix% <green>Adicionado <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar ação selecionada na linha selecionada'
        - ''
        - '<yellow><line> <gray>linha para adicionar'
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
      feedback: '%prefix% <green>Linha <yellow>%line% <green>adicionada como <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Substituir ação na linha selecionada'
        - ''
        - '<yellow><line> <gray>a linha para substituir'
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
      feedback: '%prefix% <green>Linha <yellow>%line% <green>definir como <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover ação na linha selecionada'
        - ''
        - '<yellow><line> <gray>a linha a ser removida'
      feedback: '%prefix% <green>Linha removida <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina permissão para usar este item'
        - ''
        - '<yellow>[permissão] <gray>a permissão a ser definida, por padrão nenhuma'
      feedback:
        set: '%prefix% <green>Permissão <yellow>%permission% <green> agora é necessária para usar este item'
        removed: '%prefix% <green>Agora nenhuma permissão é necessária para usar este item'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina um tempo de espera para usar um item novamente'
        - ''
        - '<yellow>[ms] <gray>quanto tempo antes de poder usar'
        - '<gray>o item novamente, por padrão 0'
        - '<gray>Nota: o tempo de espera é definido com base em cooldownid, diferente'
        - '<gray> itens com o mesmo cooldownid compartilham o mesmo tempo de espera'
        - '<gray>Nota: o tempo de espera é preservado no logout do jogador e na reinicialização do servidor'
      feedback:
        set: '%prefix% <green>Este item tem um tempo de espera de <yellow>%cooldown_seconds% <green>segundos'
        removed: '%prefix% <green>Este item não tem tempo de espera'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina um ID de resfriamento para um item'
        - ''
        - '<yellow>[id] <gray>quanto tempo antes de poder usar o item novamente'
        - '<gray>Nota: o tempo de espera é definido com base em cooldownid, diferente'
        - '<gray> itens com o mesmo cooldownid compartilham o mesmo tempo de espera'
      feedback:
        set: '%prefix% <green>Este item usa o id <yellow>%id% <green>para resfriamento'
        removed: '%prefix% <green>Este item usa <yellow>padrão <green>id para resfriamento'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Defina uma mensagem de espera'
        - ''
        - '<yellow>[mensagem] <gray>a mensagem a ser mostrada quando o item não pode ser usado'
        - '<gray>ainda enquanto o tempo de espera estiver ativo'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Mensagem de feedback para o tempo de espera definido como ''<white>%msg%<green>'' quando o tempo de espera está ativo'
        removed: '%prefix% <green>Mensagem de feedback para resfriamento removida'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Defina um tipo de mensagem de espera'
        - ''
        - '<yellow>[tipo] <gray>chat ou actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Mensagem de feedback para resfriamento definida como tipo ''<yellow>%type%<green>'''
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina quantas vezes o item pode ser usado'
        - ''
        - '<gray>Nota: use <yellow>-1 <gray>para usos ilimitados'
      feedback:
        set: '%prefix% <green>Este item tem <yellow>%uses% <green>usos antes de ser consumido'
        unlimited: '%prefix% <green>Este item tem <yellow>usos ilimitados <green>'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Definir usos máximos para o item'
        - ''
        - '<gray>Usado principalmente para fins estéticos com'
        - '<gray>display usa como true'
        - ''
        - '<gray>Nota: use <yellow>-1 <gray>para usos ilimitados'
      feedback:
        set: '%prefix% <green>Este item tem <yellow>%uses% <green>max usos'
        unlimited: '%prefix% <green>Este item tem <yellow>ilimitado <green>usos máximos'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Consumir o item no último uso'
        - ''
        - '<gray>Nota: quando true e o item consomem'
        - '<gray> é o último uso, o item é destruído'
      feedback:
        set: '%prefix% <green>O item é destruído ao atingir seu último uso'
        unset: '%prefix% <green>O item não é destruído ao atingir seu último uso'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Tempo de espera restante da exibição visual'
        - ''
        - '<gray>Quando true aplica um efeito de resfriamento semelhante a'
        - '<gray>recarga de pérolas para o item'
        - ''
        - '<gray>Nota: Infelizmente este efeito visual também'
        - '<gray> aplica-se a qualquer item do mesmo tipo'
      feedback:
        set: '%prefix% <green>Agora o item mostra o tempo de espera visual'
        unset: '%prefix% <green>Agora o item não mostrará o tempo de espera visual'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Exibir usos à esquerda'
        - ''
        - '<gray>Quando true adiciona uma linha para descrever'
        - '<gray>quantos usos restam'
        - ''
        - '<gray>Nota: Infelizmente este efeito visual também'
        - '<gray> aplica-se a qualquer item do mesmo tipo'
      feedback:
        set: '%prefix% <green>Agora o item mostra os usos restantes e máximos'
        unset: '%prefix% <green>Agora o item não mostrará os usos restantes e máximos'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Define uma atividade (algumas ações)'
      - '<gray>uma atividade pode ser ativada por gatilhos'
      - '<gray>os gatilhos podem ser associados a itens (/it trigger)'
      - ''
      - '<yellow>Criar <id> <gray>- criar uma nova atividade'
      - '<yellow>Open <id> <gray>- abre uma interface gráfica para a atividade selecionada'
      - '<yellow>Excluir <id> <gray>- excluir atividade selecionada'
      - '<yellow>Clone <id> <new id><gray>- clonar atividade selecionada'
      - '<yellow>Renomear <id> <new id><gray>- renomear atividade selecionada'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Atividade <gold>%id% <red>não existe'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Atividade <gold>%id% <red>já está em uso'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Crie uma nova atividade'
        - ''
        - '<yellow><new id> <gray>é o id da atividade'
        - '<gray>id deve começar com uma letra e pode ser alfanumérico'
        - '<gray>pode também conter o símbolo _'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>criada'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Renomear ID da atividade'
        - ''
        - '<yellow><id> <gray>é o ID atual da atividade'
        - '<yellow><new id> <gray>é o novo id da atividade'
        - '<gray>id deve começar com uma letra e pode ser alfanumérico'
        - '<gray>pode também conter o símbolo _'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>renomeado <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Abra uma interface gráfica para editar a atividade'
        - ''
        - '<yellow><id> <gray>é o id da atividade'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Excluir atividade selecionada'
        - ''
        - '<yellow><id> <gray>é o id da atividade'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>excluída'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>Clonar atividade selecionada'
        - ''
        - '<yellow><id> <gray>é o id da atividade a ser clonada'
        - '<yellow><clone id> <gray>é o id do clone'
        - '<gray>id deve começar com uma letra e pode ser alfanumérico'
        - '<gray>pode também conter o símbolo _'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>clonada para <yellow>%clone_id%'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Definir usos necessários para a atividade selecionada'
        - ''
        - '<yellow><id> <gray>é o id da atividade a ser clonada'
        - '<yellow><amount> <gray>quantidade de usos consumidos pela ativação da atividade'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>usa consumo é <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Adicione uma condição para ativar a atividade'
        - ''
        - '<yellow><id> <gray>é o id da atividade'
        - '<yellow>[!] <gray>é o ''!'' se você quiser que a condição seja revertida'
        - '<yellow><conditiontype> <gray>é o tipo de condição'
        - '<yellow>[informações da condição] <gray>é uma informação adicional que o tipo de condição pode precisar'
      feedback: '%prefix% <green>Atividade <yellow>%id% <green>condição adicionada <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>Define ações realizadas quando o item é consumido, como alimentos e bebidas'
      - ''
      - '<yellow>Adicionar <type> <action> <gray>- adicionar ação selecionada'
      - '<yellow>Set <line> <type> <action> <gray>- substitui a ação na linha escolhida'
      - '<yellow>Remover <line> <gray>- remover ação na linha escolhida'
      - '<yellow>Limpar <gray>- remover todas as ações'
      - '<yellow>Permissão [permissão] <gray>- defina uma permissão necessária para consumir este item'
      - '<yellow>Cooldown <ms> <gray>- defina um cooldown para usar este item novamente'
      - '<yellow>Cooldownid [id] <gray>- definir o ID de cooldown usado para isso'
      - '<yellow>Info <gray>- mostra informações sobre ações no item atual'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar ação selecionada'
        - ''
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Adicionar ação selecionada na linha selecionada'
        - ''
        - '<yellow><line> <gray>linha para adicionar'
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Substituir ação na linha selecionada'
        - ''
        - '<yellow><line> <gray>a linha para substituir'
        - '<yellow><type> <gray>tipo de ação'
        - '<yellow><action> <gray>informações adicionais para ação'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Remover ação na linha selecionada'
        - ''
        - '<yellow><line> <gray>a linha a ser removida'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina permissão para consumir este item'
        - ''
        - '<yellow>[permissão] <gray>a permissão a ser definida, por padrão nenhuma'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina um tempo de espera para consumir um item novamente'
        - ''
        - '<yellow>[ms] <gray>quanto tempo antes de poder consumir'
        - '<gray>o item novamente, por padrão 0'
        - '<gray>Nota: o tempo de espera é definido com base em cooldownid, diferente'
        - '<gray> itens com o mesmo cooldownid compartilham o mesmo tempo de espera'
        - '<gray>Nota: o tempo de espera é preservado no logout do jogador e na reinicialização do servidor'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Defina um ID de resfriamento para um item'
        - ''
        - '<yellow>[id] <gray>quanto tempo antes de poder consumir o item novamente'
        - '<gray>Nota: o tempo de espera é definido com base em cooldownid, diferente'
        - '<gray> itens com o mesmo cooldownid compartilham o mesmo tempo de espera'
    feedback:
      actions:
        set: '<green>Linha <yellow>%line% <green>definida como <yellow>%action%'
        remove: '<green>Linha removida <yellow>%line% <green>(<yellow>%action%<green>)'
        clear: '<green>Ações de consumo limpas neste item'
        permission:
          set: '<green>Permissão <yellow>%permission% <green>agora é necessária para consumir este item'
          removed: '<green>Agora nenhuma permissão é necessária para consumir este item'
        cooldownid:
          set: '<green>Este item usa o id <yellow>%id% <green>para recarga'
          removed: '<green>Este item usa <yellow>default <green>id para cooldown'
        cooldown:
          set: '<green>Este item tem um tempo de espera de <yellow>%cooldown_seconds% <green>segundos'
          removed: '<green>Este item não tem tempo de espera'
  effects:
    description:
      - '<gradient:#A78BFA:gold><b>Adicionar efeitos de poção permanente'
      - '<gray>Abra uma interface gráfica'
      - '<gray>Lembre-se de selecionar qual equipamento'
      - '<gray> slot aplique o efeito'
    params: ''
  usepermission:
    description:
      - '<gradient:#A78BFA:gold><b>Defina uma permissão para usar este item (clique com o botão direito do mouse)'
      - ''
      - '<yellow>setpermission <permission> <gray>set permissão necessária'
      - '<yellow>setmessage <message> <gray>set mensagem de falta de permissão'
    params: '[...]'
    setpermission:
      feedback: '<green>A permissão de uso agora está definida como <yellow>%value%'
      feedback-reset: '<green>O uso da permissão necessária foi removido'
    setmessage:
      feedback: '<green>A mensagem de negação de permissão de uso agora está definida como <yellow>%value%'
      feedback-reset: '<green>A mensagem de negação de permissão de uso foi removida'
  wearpermission:
    description:
      - '<gradient:#A78BFA:gold><b>Defina uma permissão para usar este item'
      - ''
      - '<gray>Tentar usar o item cairá'
      - '<gray>no inventário ou no chão se estiver cheio'
      - '<gray>'
      - '<yellow>setpermission <permission> <gray>set permissão necessária'
      - '<yellow>setmessage <message> <gray>set mensagem de falta de permissão'
    params: '[...]'
    setpermission:
      feedback: '<green>A permissão de desgaste agora está definida como <yellow>%value%'
      feedback-reset: '<green>A permissão necessária para desgaste foi removida'
    setmessage:
      feedback: '<green>A mensagem de negação de permissão de uso agora está definida como <yellow>%value%'
      feedback-reset: '<green>A mensagem de negação de permissão de uso foi removida'
  help:
    header-name: 'ItemTag'
    description:
      - '<gradient:#A78BFA:gold><b>Mostra ajuda do ItemTag</b></gradient>'
      - ''
      - '<gray><yellow>[page] </yellow>Página de ajuda'
      - '<gray><yellow>[subcommand] </yellow>Ajuda para um subcomando'
    params: '[page/subcommand]'
itemtagreload:
  success: '<blue>[<white>ItemTag<blue>] <green>Recarregado'
gui:
  middleclick: #middle click can't be used unless on creative mode, an alternative to middle click is pressing hotbar button 1
    creative: 'Clique do meio'
    other: 'Pressione 1'
  previous-page:
    #Holders: %player_name% %page% %target_page%
    description:
      - '<gold><bold>Página anterior'
      - ''
      - '<gray>[<white>Clique<gray>]<gray> Ir para a página <yellow>%target_page%'
  next-page:
    #Holders: %player_name% %page% %target_page%
