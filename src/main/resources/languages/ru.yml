generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Команда только для игроков.'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Вам нужно держать предмет в руке'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>У вас нет разрешения %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>У вас нет разрешения на использование этой команды.'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Помощь</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Помощь</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Помощь</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Перейти на страницу %target%'
    prev_hover: '<gold><b>Перейти на страницу %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Неправильное значение флага! <dark_red>[<gold>наведите здесь<dark_red>]'
    wrong-action: '%prefix% <red>Неправильный тип действия! <dark_red>[<gold>наведите здесь<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Псевдонимы:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Переключить пользовательские флаги на элементе'
      - ''
      - '<yellow><flag> <gray>название флага'
      - '<yellow>[true/false] <gray>значение флага; если опущено, инвертировать текущее значение'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>Предмет можно разместить.'
        custom: '%prefix% <green>Невозможно разместить предмет.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Вы не можете разместить этот предмет'
    usable:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать.'
        custom: '%prefix% <green>Предмет нельзя использовать (щелкните правой кнопкой мыши).'
    smelt:
      feedback:
        standard: '%prefix% <green>Предмет можно приготовить или выплавить в печи.'
        custom: '%prefix% <green>Предмет нельзя приготовить или выплавить в печи.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать в качестве топлива для печи.'
        custom: '%prefix% <green>Предмет нельзя использовать в качестве топлива для печи.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать в качестве ингредиента рецепта.'
        custom: '%prefix% <green>Этот предмет нельзя использовать в качестве ингредиента рецепта.'
    enchantable:
      feedback:
        standard: '%prefix% <green>Предмет можно зачаровать.'
        custom: '%prefix% <green>Предмет нельзя зачаровать.'
    renamable:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать на наковальне.'
        custom: '%prefix% <green>Предмет нельзя использовать на наковальне.'
    grindable:
      feedback:
        standard: '%prefix% <green>Предмет можно распылить с помощью точильного камня.'
        custom: '%prefix% <green>Предмет нельзя распылить с помощью точильного камня.'
    equipment:
      feedback:
        standard: '%prefix% <green>Предмет можно экипировать.'
        custom: '%prefix% <green>Предмет нельзя надеть.'
    entityfood:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать в пищу животным.'
        custom: '%prefix% <green>Предмет нельзя использовать в пищу животным.'
    clickmove:
      feedback:
        standard: '%prefix% <green>Предмет можно перемещать в инвентаре.'
        custom: '%prefix% <green>Предмет нельзя переместить в инвентаре.'
    tradeable:
      feedback:
        standard: '%prefix% <green>Предмет можно продать сельским жителям.'
        custom: '%prefix% <green>Этот предмет нельзя продать сельским жителям.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>Предмет можно использовать в качестве ингредиента для кузницы.'
        custom: '%prefix% <green>Предмет нельзя использовать в качестве ингредиента для кузнечного стола.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' не является допустимым типом <dark_red>[<gold>наведите здесь<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' не является допустимой информацией для <gold>%action% <dark_red>[<gold>наведите здесь<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Устанавливает действия, выполняемые при использовании предмета.'
      - ''
      - '<yellow>Add <type> <action> <gray>- добавить выбранное действие'
      - '<yellow>Set <line> <type> <action> <gray>- заменить действие на выбранной строке'
      - '<yellow>Remove <line> <gray>- удалить действие на выбранной строке'
      - '<yellow>Clear <gray>- удалить все действия'
      - '<yellow>Permission [permission] <gray>- установить необходимое разрешение для использования этого предмета.'
      - '<yellow>Cooldown <ms> <gray>- установить время восстановления для повторного использования этого предмета.'
      - '<yellow>Cooldownid [id] <gray>- установить для этого идентификатор используемого времени восстановления.'
      - '<yellow>Cooldownmsg [msg] <gray>- установить обратную связь по времени восстановления.'
      - '<yellow>Cooldownmsgtype [type] <gray>- установить тип обратной связи по перезарядке (chat или actionbar)'
      - '<yellow>Uses [amount] <gray>- установите, сколько раз можно использовать этот предмет.'
      - '<yellow>Info <gray>- показать информацию о действиях над текущим элементом'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить выбранное действие'
        - ''
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
      feedback: '%prefix% <green>Добавлено <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить выбранное действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка для добавления'
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
      feedback: '%prefix% <green>Строка <yellow>%line% <green>добавлена как <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Заменить действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка для замены'
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
      feedback: '%prefix% <green>Линия <yellow>%line% <green>установить как <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Удалить действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка, которую нужно удалить'
      feedback: '%prefix% <green>Удалена строка <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Установить разрешение на использование этого предмета.'
        - ''
        - '<yellow>[permission] <gray>разрешение на установку, по умолчанию нет'
      feedback:
        set: '%prefix% <green>Теперь для использования этого предмета требуется разрешение <yellow>%permission% <green>.'
        removed: '%prefix% <green>Теперь для использования этого предмета не требуется разрешения.'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Установить время восстановления, чтобы снова использовать предмет.'
        - ''
        - '<yellow>[ms] <gray>сколько времени осталось до того, как можно будет использовать'
        - '<gray>опять предмет, по умолчанию 0'
        - '<gray>Примечание: время восстановления устанавливается на основе cooldownid, разное.'
        - '<gray> предметы с одинаковым cooldownid имеют одинаковое время восстановления'
        - '<gray>Примечание: время восстановления сохраняется при выходе игрока из системы и перезапуске сервера.'
      feedback:
        set: '%prefix% <green>Время восстановления этого предмета составляет <yellow>%cooldown_seconds% <green>секунды.'
        removed: '%prefix% <green>У этого предмета нет времени восстановления.'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Установить идентификатор перезарядки предмета.'
        - ''
        - '<yellow>[id] <gray>общий идентификатор перезарядки'
        - '<gray>Примечание: время восстановления устанавливается на основе cooldownid, разное.'
        - '<gray> предметы с одинаковым cooldownid имеют одинаковое время восстановления'
      feedback:
        set: '%prefix% <green>Этот предмет использует идентификатор <yellow>%id% <green>для перезарядки.'
        removed: '%prefix% <green>Этот предмет использует <yellow>по умолчанию <green>id для перезарядки.'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Установить сообщение о времени восстановления.'
        - ''
        - '<yellow>[message] <gray>сообщение, показывающее, когда предмет нельзя использовать.'
        - '<gray>пока активно время восстановления'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Сообщение обратной связи для времени восстановления, установленного как «<white>%msg%<green>», когда время восстановления активно.'
        removed: '%prefix% <green>Сообщение обратной связи по времени восстановления удалено.'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Установить тип сообщения о перезарядке.'
        - ''
        - '<yellow>[type] <gray>chat или actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Сообщение обратной связи для времени восстановления, установленного как тип «<yellow>%type%<green>»'
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Установите, сколько раз можно использовать предмет.'
        - ''
        - '<gray>Примечание: используйте <yellow>-1 <gray> для неограниченного использования.'
      feedback:
        set: '%prefix% <green>Этот предмет можно использовать <yellow>%uses% <green>, прежде чем он будет использован.'
        unlimited: '%prefix% <green>У этого предмета <yellow>неограниченное <green>использование.'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Установить максимальное количество использований предмета.'
        - ''
        - '<gray>Используется в основном в эстетических целях с'
        - '<gray>Использование дисплея установлено на true'
        - ''
        - '<gray>Примечание: используйте <yellow>-1 <gray> для неограниченного использования.'
      feedback:
        set: '%prefix% <green>Максимальное использование этого предмета: <yellow>%uses% <green>.'
        unlimited: '%prefix% <green>У этого предмета есть <yellow>неограниченное <green>максимальное использование.'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Используйте предмет при последнем использовании.'
        - ''
        - '<gray>Примечание: когда true и предмет расходуется'
        - '<gray> при последнем использовании предмет уничтожается'
      feedback:
        set: '%prefix% <green>Предмет уничтожается при последнем использовании.'
        unset: '%prefix% <green>Предмет не уничтожается после последнего использования.'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Визуально отображать оставшееся время восстановления.'
        - ''
        - '<gray>Когда true элемент показывает анимацию, похожую на'
        - '<gray>анимация перезарядки жемчуга Края'
        - ''
        - '<gray>Примечание: к сожалению, этот визуальный эффект также'
        - '<gray> применяется к любому предмету того же типа.'
      feedback:
        set: '%prefix% <green>Теперь предмет показывает визуальное время восстановления.'
        unset: '%prefix% <green>Теперь предмет не будет отображать визуальное время восстановления.'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Показывать число оставшихся использований'
        - ''
        - '<gray>Когда true добавляет строку для описания'
        - '<gray>сколько осталось использований'
        - ''
        - '<gray>Примечание: к сожалению, этот визуальный эффект также'
        - '<gray> применяется к любому предмету того же типа.'
      feedback:
        set: '%prefix% <green>Теперь предмет показывает оставшееся и максимальное количество использований.'
        unset: '%prefix% <green>Предмет больше не показывает оставшееся и максимальное количество использований.'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Задает активность (некоторые действия)'
      - '<gray>действие может быть активировано триггерами'
      - '<gray>триггеры могут быть связаны с элементами (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- создать новое занятие'
      - '<yellow>Open <id> <gray>- открыть графический интерфейс для выбранного действия.'
      - '<yellow>Delete <id> <gray>- удалить выбранное действие'
      - '<yellow>Clone <id> <new id><gray>- клонировать выбранное действие'
      - '<yellow>Rename <id> <new id><gray>- переименовать выбранное действие'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Активность <gold>%id% <red>не существует'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Активность <gold>%id% <red> уже используется'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Создать новое действие'
        - ''
        - '<yellow><new id> <gray> - идентификатор активности'
        - '<gray>id должен начинаться с буквы и может быть буквенно-цифровым.'
        - '<gray>может также содержать символ _'
      feedback: '%prefix% <green>Действие <yellow>%id% <green>создано'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Переименовать идентификатор действия'
        - ''
        - '<yellow><id> <gray> - текущий идентификатор активности.'
        - '<yellow><new id> <gray> - новый идентификатор активности.'
        - '<gray>id должен начинаться с буквы и может быть буквенно-цифровым.'
        - '<gray>может также содержать символ _'
      feedback: '%prefix% <green>Действие <yellow>%id% <green>переименовано <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Откройте графический интерфейс для редактирования действия.'
        - ''
        - '<yellow><id> <gray> - идентификатор активности'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Удалить выбранное действие'
        - ''
        - '<yellow><id> <gray> - идентификатор активности'
      feedback: '%prefix% <green>Активность <yellow>%id% <green>удалена'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>Клонировать выбранное действие'
        - ''
        - '<yellow><id> <gray> - идентификатор выбранного действия.'
        - '<yellow><clone id> <gray> - идентификатор клона'
        - '<gray>id должен начинаться с буквы и может быть буквенно-цифровым.'
        - '<gray>может также содержать символ _'
      feedback: '%prefix% <green>Активность <yellow>%id% <green>клонировано в <yellow>%clone_id%'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Укажите использование, необходимое для выбранного действия.'
        - ''
        - '<yellow><id> <gray> - идентификатор выбранного действия.'
        - '<yellow><amount> <gray>количество использований, потраченных на активацию активности'
      feedback: '%prefix% <green>Деятельность <yellow>%id% <green>потребление составляет <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Добавьте условие для активации активности.'
        - ''
        - '<yellow><id> <gray> - идентификатор активности'
        - '<yellow>[!] <gray>это ''!'' если вы хотите, чтобы условие было отменено'
        - '<yellow><conditiontype> <gray>тип состояния'
        - '<yellow>[condition info] <gray> - дополнительная информация, которая может потребоваться для типа условия.'
      feedback: '%prefix% <green>Активность <yellow>%id% <green>добавленное условие <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>Устанавливает действия, выполняемые при потреблении предмета, например еды и напитков.'
      - ''
      - '<yellow>Add <type> <action> <gray>- добавить выбранное действие'
      - '<yellow>Set <line> <type> <action> <gray>- заменить действие на выбранной строке'
      - '<yellow>Remove <line> <gray>- удалить действие на выбранной строке'
      - '<yellow>Clear <gray>- удалить все действия'
      - '<yellow>Permission [permission] <gray>- установить необходимое разрешение на использование этого предмета.'
      - '<yellow>Cooldown <ms> <gray>- установить время восстановления для повторного использования этого предмета.'
      - '<yellow>Cooldownid [id] <gray>- установить для этого идентификатор используемого времени восстановления.'
      - '<yellow>Info <gray>- показать информацию о действиях над текущим элементом'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить выбранное действие'
        - ''
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Добавить выбранное действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка для добавления'
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Заменить действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка для замены'
        - '<yellow><type> <gray>тип действия'
        - '<yellow><action> <gray>дополнительная информация для действия'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Удалить действие в выбранной строке'
        - ''
        - '<yellow><line> <gray>строка, которую нужно удалить'
    permission:
      params: 'permission [permission]'
      description:
