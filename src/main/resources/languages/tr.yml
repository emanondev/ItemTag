generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Yalnızca Oyuncular için Komut'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Elinizde bir eşya tutmanız gerekiyor'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>İzniniz yok %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>Bu komutu kullanma izniniz yok'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Yardım</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Yardım</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Yardım</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Sayfaya git %target%'
    prev_hover: '<gold><b>Sayfaya git %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Yanlış Bayrak Değeri! <dark_red>[<gold>buraya gelin<dark_red>]'
    wrong-action: '%prefix% <red>Yanlış Eylem Türü! <dark_red>[<gold>buraya gelin<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Takma adlar:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Öğedeki Özel bayrakları aç/kapat'
      - ''
      - '<yellow><flag> <gray>bayrak adı'
      - '<yellow>[true/false] <gray>bayrak değeri; atlanırsa mevcut değeri ters çevirin'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>Ürün yerleştirilebilir.'
        custom: '%prefix% <green>Öğe yerleştirilemiyor.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Bu öğeyi yerleştiremezsiniz'
    usable:
      feedback:
        standard: '%prefix% <green>Ürün kullanılabilir.'
        custom: '%prefix% <green>Öğe kullanılamaz (Sağ tıklama).'
    smelt:
      feedback:
        standard: '%prefix% <green>Ürün fırınlarda pişirilebilir veya eritilebilir.'
        custom: '%prefix% <green>Ürün fırında pişirilemez veya eritilemez.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>Ürün fırın yakıtı olarak kullanılabilir.'
        custom: '%prefix% <green>Ürün fırın yakıtı olarak kullanılamaz.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>Ürün tarif malzemesi olarak kullanılabilir.'
        custom: '%prefix% <green>Bu ürün tarif malzemesi olarak kullanılamaz.'
    enchantable:
      feedback:
        standard: '%prefix% <green>Eşya büyülenebilir.'
        custom: '%prefix% <green>Bu eşya büyülenemez.'
    renamable:
      feedback:
        standard: '%prefix% <green>Bu eşya örs üzerinde kullanılabilir.'
        custom: '%prefix% <green>Bu eşya örs üzerinde kullanılamaz.'
    grindable:
      feedback:
        standard: '%prefix% <green>Eşyanın büyüsü bileği taşı ile etkisiz hale getirilebilir.'
        custom: '%prefix% <green>Bu eşyanın büyüsü bileme taşıyla bozulamaz.'
    equipment:
      feedback:
        standard: '%prefix% <green>Eşya donatılabilir.'
        custom: '%prefix% <green>Bu eşya donatılamaz.'
    entityfood:
      feedback:
        standard: '%prefix% <green>Ürün hayvan yemi olarak kullanılabilir.'
        custom: '%prefix% <green>Bu ürün hayvan yemi olarak kullanılamaz.'
    clickmove:
      feedback:
        standard: '%prefix% <green>Eşya envanterde taşınabilir.'
        custom: '%prefix% <green>Eşya envanterde taşınamaz.'
    tradeable:
      feedback:
        standard: '%prefix% <green>Eşya köylülerle takas edilebilir.'
        custom: '%prefix% <green>Eşya köylülerle takas edilemez.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>Bu eşya demircilik masasının malzemesi olarak kullanılabilir.'
        custom: '%prefix% <green>Bu eşya demircilik masası malzemesi olarak kullanılamaz.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' geçerli bir tür değil <dark_red>[<gold>buraya gelin<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'', <gold>%action% <dark_red>[<gold> için geçerli bir bilgi değil, buraya gelin<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Öğe kullanıldığında yapılacak eylemleri ayarlar'
      - ''
      - '<yellow>Add <type> <action> <gray>- seçili eylemi ekle'
      - '<yellow>Set <line> <type> <action> <gray>- seçilen satırdaki eylemi değiştir'
      - '<yellow>Remove <line> <gray>- seçilen satırdaki eylemi kaldır'
      - '<yellow>Clear <gray>- tüm eylemleri kaldır'
      - '<yellow>Permission [permission] <gray>- bu öğeyi kullanmak için gerekli izni ayarlayın'
      - '<yellow>Cooldown <ms> <gray>- bu öğeyi tekrar kullanmak için bir bekleme süresi belirleyin'
      - '<yellow>Cooldownid [id] <gray>- bunun için kullanılan bekleme süresi kimliğini ayarlayın'
      - '<yellow>Cooldownmsg [msg] <gray>- bekleme süresi geri bildirimini ayarlayın'
      - '<yellow>Cooldownmsgtype [type] <gray>- bekleme süresi geri bildirim türünü ayarlayın (chat veya actionbar)'
      - '<yellow>Uses [amount] <gray>- bu öğenin kaç kez kullanılabileceğini ayarlayın'
      - '<yellow>Info <gray>- geçerli öğedeki eylemlerle ilgili bilgileri göster'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçili eylemi ekle'
        - ''
        - '<yellow><type> <gray>eylem türü'
        - '<yellow><action> <gray>eylem için ek bilgi'
      feedback: '%prefix% <green>Eklendi <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçilen eylemi seçilen satıra ekle'
        - ''
        - '<yellow><line> <gray>eklenecek satır'
        - '<yellow><type> <gray>eylem türü'
        - '<yellow><action> <gray>eylem için ek bilgi'
      feedback: '%prefix% <green>Satır <yellow>%line% <green><yellow>%action% olarak eklendi'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçili satırdaki eylemi değiştir'
        - ''
        - '<yellow><line> <gray>değiştirilecek satır'
        - '<yellow><type> <gray>eylem türü'
        - '<yellow><action> <gray>eylem için ek bilgi'
      feedback: '%prefix% <green>Çizgi <yellow>%line% <green><yellow>%action% olarak ayarlayın'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçili satırdaki eylemi kaldır'
        - ''
        - '<yellow><line> <gray>kaldırılacak satır'
      feedback: '%prefix% <green>Satır kaldırıldı <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Bu öğeyi kullanma iznini ayarlayın'
        - ''
        - '<yellow>[permission] <gray>ayarlama izni, varsayılan olarak yok'
      feedback:
        set: '%prefix% <green>Bu öğeyi kullanmak için artık <yellow>%permission% <green>izin gerekli'
        removed: '%prefix% <green>Artık bu öğeyi kullanmak için herhangi bir izne gerek yok'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Bir öğeyi tekrar kullanmak için bekleme süresi ayarlayın'
        - ''
        - '<yellow>[ms] <gray>Kullanılabilmesi için ne kadar süre geçmesi gerekiyor?'
        - '<gray>öğeyi tekrar varsayılan olarak 0'
        - '<gray>Not: Bekleme süresi cooldownid''e göre ayarlanır, farklı'
        - '<gray> aynı cooldownid''ye sahip öğeler aynı bekleme süresini paylaşır'
        - '<gray>Not: Bekleme süresi oyuncu oturumu kapatıldığında ve sunucu yeniden başlatıldığında korunur'
      feedback:
        set: '%prefix% <green>Bu eşyanın bekleme süresi <yellow>%cooldown_seconds% <green>saniyedir'
        removed: '%prefix% <green>Bu öğenin bekleme süresi yok'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Bir öğe için bekleme süresi kimliği belirleyin'
        - ''
        - '<yellow>[id] <gray>paylaşılan bekleme süresi tanımlayıcısı'
        - '<gray>Not: Bekleme süresi cooldownid''e göre ayarlanır, farklı'
        - '<gray> aynı cooldownid''ye sahip öğeler aynı bekleme süresini paylaşır'
      feedback:
        set: '%prefix% <green>Bu öğe bekleme süresi için <yellow>%id% <green> kimliğini kullanır'
        removed: '%prefix% <green>Bu öğe, bekleme süresi için <yellow>varsayılan <green>id''yi kullanır'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Bir bekleme süresi mesajı ayarlayın'
        - ''
        - '<yellow>[message] <gray>öğe kullanılamadığında gösterilecek mesaj'
        - '<gray>henüz bekleme süresi aktifken'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Soğuma süresi aktifken geri bildirim mesajı ''<white>%msg%<green>'' olarak ayarlandı'
        removed: '%prefix% <green>Bekleme süresi için Geri Bildirim Mesajı kaldırıldı'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Bir bekleme süresi mesajı türü ayarlayın'
        - ''
        - '<yellow>[type] <gray>chat veya actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Soğuma süresi için geri bildirim mesajı ''<yellow>%type%<green>'' olarak ayarlandı'
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Öğenin kaç kez kullanılabileceğini ayarlayın'
        - ''
        - '<gray>Not: Sınırsız kullanım için <yellow>-1 <gray> kullanın'
      feedback:
        set: '%prefix% <green>Bu öğenin tüketilmeden önce <yellow>%uses% <green>kullanımı vardır'
        unlimited: '%prefix% <green>Bu öğenin <yellow>sınırsız <green>kullanımı vardır'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Öğenin maksimum kullanım sayısını ayarlayın'
        - ''
        - '<gray>Genellikle estetik amaçlı kullanılır.'
        - '<gray>Ekran Kullanımları true olarak ayarlandı'
        - ''
        - '<gray>Not: Sınırsız kullanım için <yellow>-1 <gray> kullanın'
      feedback:
        set: '%prefix% <green>Bu öğenin <yellow>%uses% <green>maksimum kullanımı var'
        unlimited: '%prefix% <green>Bu öğenin <yellow>sınırsız <green>maksimum kullanımı vardır'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Öğeyi son kullanımda tüket'
        - ''
        - '<gray>Not: true ve öğe tükendiğinde'
        - '<gray> Son kullanımında eşya yok edilir'
      feedback:
        set: '%prefix% <green>Eşya son kullanımına ulaştığında yok edilir'
        unset: '%prefix% <green>Eşya son kullanımına ulaştığında yok edilmez'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Kalan bekleme süresini görsel olarak göster'
        - ''
        - '<gray>true öğe şuna benzer bir animasyon gösterdiğinde'
        - '<gray>ender incisinin bekleme süresi animasyonu'
        - ''
        - '<gray>Not: Maalesef bu görsel efekt de'
        - '<gray> aynı türdeki tüm öğeler için geçerlidir'
      feedback:
        set: '%prefix% <green>Artık öğe görsel bekleme süresini gösteriyor'
        unset: '%prefix% <green>Artık eşya görsel bekleme süresini göstermeyecek'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Kalan kullanım sayısını göster'
        - ''
        - '<gray>true açıklamak için bir satır eklediğinde'
        - '<gray>kaç kullanım kaldı'
        - ''
        - '<gray>Not: Maalesef bu görsel efekt de'
        - '<gray> aynı türdeki tüm öğeler için geçerlidir'
      feedback:
        set: '%prefix% <green>Ürün artık kalan ve maksimum kullanım sayısını gösteriyor'
        unset: '%prefix% <green>Ürün artık kalan ve maksimum kullanım sayısını göstermiyor'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Bir etkinlik ayarlar (bazı eylemler)'
      - '<gray>bir etkinlik tetikleyiciler tarafından etkinleştirilebilir'
      - '<gray>tetikleyiciler öğelerle ilişkilendirilebilir (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- yeni bir aktivite oluştur'
      - '<yellow>Open <id> <gray>- seçilen etkinlik için bir GUI aç'
      - '<yellow>Delete <id> <gray>- seçilen aktiviteyi sil'
      - '<yellow>Clone <id> <new id><gray>- seçilen aktiviteyi klonla'
      - '<yellow>Rename <id> <new id><gray>- seçilen etkinliği yeniden adlandır'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Etkinlik <gold>%id% <red>mevcut değil'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Etkinlik <gold>%id% <red>zaten kullanılıyor'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Yeni bir aktivite oluştur'
        - ''
        - '<yellow><new id> <gray>etkinliğin kimliğidir'
        - '<gray>id bir harfle başlamalı ve alfasayısal olabilir'
        - '<gray>ayrıca _ sembolünü de içerebilir'
      feedback: '%prefix% <green>Aktivite <yellow>%id% <green>oluşturuldu'
    rename:
      params: 'rename <id> <new id>'
