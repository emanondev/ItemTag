        - ''
        - '<yellow><id> <gray>seçilen etkinliğin kimliğidir'
        - '<yellow><clone id> <gray> klonun kimliğidir'
        - '<gray>id bir harfle başlamalı ve alfasayısal olabilir'
        - '<gray>ayrıca _ sembolünü de içerebilir'
      feedback: '%prefix% <green>Aktivite <yellow>%id% <green><yellow>%clone_id%''ye kopyalandı'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Seçilen etkinlik için gerekli kullanımları ayarlayın'
        - ''
        - '<yellow><id> <gray>seçilen etkinliğin kimliğidir'
        - '<yellow><amount> <gray>etkinlik aktivasyonu tarafından tüketilen kullanım miktarı'
      feedback: '%prefix% <green>Aktivite <yellow>%id% <green>tüketimi kullanır <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Etkinliği etkinleştirmek için bir koşul ekleyin'
        - ''
        - '<yellow><id> <gray>etkinliğin kimliğidir'
        - '<yellow>[!] <gray>''!'' koşulun tersine çevrilmesini istiyorsanız'
        - '<yellow><conditiontype> <gray>durum türüdür'
        - '<yellow>[condition info] <gray>koşul türünün ihtiyaç duyabileceği ek bilgidir'
      feedback: '%prefix% <green>Aktivite <yellow>%id% <green>eklenen koşul <yellow>%condition%'
