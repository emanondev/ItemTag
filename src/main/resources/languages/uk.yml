generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Команда лише для гравців'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Вам потрібно тримати предмет у руці'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>У вас немає дозволу %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>У вас немає дозволу на використання цієї команди'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Допомога</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Допомога</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Допомога</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Перейти на сторінку %target%'
    prev_hover: '<gold><b>Перейти на сторінку %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Неправильне значення прапорця! <dark_red>[<gold>навести сюди<dark_red>]'
    wrong-action: '%prefix% <red>Неправильний тип дії! <dark_red>[<gold>наведіть сюди<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Псевдоніми:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Увімкнути спеціальні прапорці на елементі'
      - ''
      - '<yellow><flag> <gray>назва прапорця'
      - '<yellow>[true/false] <gray>значення прапорця; якщо пропущено, інвертує поточне значення'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>Елемент можна розмістити.'
        custom: '%prefix% <green>Елемент не можна розмістити.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Ви не можете розмістити цей предмет'
    usable:
      feedback:
        standard: '%prefix% <green>Товар можна використовувати.'
        custom: '%prefix% <green>Елемент не можна використовувати (клацніть правою кнопкою миші).'
    smelt:
      feedback:
        standard: '%prefix% <green>Предмет можна варити або плавити в печах.'
        custom: '%prefix% <green>Елемент не можна варити чи плавити в печі.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>Предмет можна використовувати як паливо для печі.'
        custom: '%prefix% <green>Елемент не можна використовувати як паливо для печі.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>Предмет можна використовувати як інгредієнт рецепта.'
        custom: '%prefix% <green>Елемент не можна використовувати як інгредієнт рецепта.'
    enchantable:
      feedback:
        standard: '%prefix% <green>Предмет можна зачарувати.'
        custom: '%prefix% <green>Предмет не можна зачарувати.'
    renamable:
      feedback:
        standard: '%prefix% <green>Предмет можна використовувати на ковадлі.'
        custom: '%prefix% <green>Предмет не можна використовувати на ковадлі.'
    grindable:
      feedback:
        standard: '%prefix% <green>Предмет можна розчарувати точильним каменем.'
        custom: '%prefix% <green>Предмет не можна розчарувати точильним каменем.'
    equipment:
      feedback:
        standard: '%prefix% <green>Предмет можна комплектувати.'
        custom: '%prefix% <green>Предмет неможливо спорядити.'
    entityfood:
      feedback:
        standard: '%prefix% <green>Предмет можна використовувати як корм для тварин.'
        custom: '%prefix% <green>Товар не можна використовувати як їжу для тварин.'
    clickmove:
      feedback:
        standard: '%prefix% <green>Предмет можна перемістити в інвентарі.'
        custom: '%prefix% <green>Предмет не можна перемістити в інвентарі.'
    tradeable:
      feedback:
        standard: '%prefix% <green>Цей предмет можна обміняти з жителями села.'
        custom: '%prefix% <green>Цей предмет не можна обміняти з жителями села.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>Предмет можна використовувати як інгредієнт для ковальського столу.'
        custom: '%prefix% <green>Елемент не можна використовувати як інгредієнт для ковальського столу.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' не є дійсним типом <dark_red>[<gold>наведіть тут<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' недійсна інформація для <gold>%action% <dark_red>[<gold>наведіть тут<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Встановлює дії, які виконуються під час використання предмета'
      - ''
      - '<yellow>Add <type> <action> <gray>- додати вибрану дію'
      - '<yellow>Set <line> <type> <action> <gray>- замінити дію на вибраному рядку'
      - '<yellow>Remove <line> <gray>- видалити дію на вибраному рядку'
      - '<yellow>Clear <gray>- видалити всі дії'
      - '<yellow>Permission [permission] <gray>- встановити необхідний дозвіл для використання цього елемента'
      - '<yellow>Cooldown <ms> <gray>- встановіть час відновлення для повторного використання цього предмета'
      - '<yellow>Cooldownid [id] <gray>- встановити для цього використаний ідентифікатор часу відновлення'
      - '<yellow>Cooldownmsg [msg] <gray> - встановити зворотний зв''язок з перезарядкою'
      - '<yellow>Cooldownmsgtype [type] <gray> - встановити тип зворотного зв''язку (chat або actionbar)'
      - '<yellow>Uses [amount] <gray>- встановіть, скільки разів цей предмет можна використовувати'
      - '<yellow>Info <gray>- показати інформацію про дії з поточним елементом'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Додати вибрану дію'
        - ''
        - '<yellow><type> <gray>тип дії'
        - '<yellow><action> <gray>додаткова інформація для дії'
      feedback: '%prefix% <green>Додано <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Додати вибрану дію у вибраний рядок'
        - ''
        - '<yellow><line> <gray>рядок для додавання'
        - '<yellow><type> <gray>тип дії'
        - '<yellow><action> <gray>додаткова інформація для дії'
      feedback: '%prefix% <green>Рядок <yellow>%line% <green>додано як <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Замінити дію у вибраному рядку'
        - ''
        - '<yellow><line> <gray>рядок для заміни'
        - '<yellow><type> <gray>тип дії'
        - '<yellow><action> <gray>додаткова інформація для дії'
      feedback: '%prefix% <green>Рядок <yellow>%line% <green>встановити як <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Видалити дію на вибраному рядку'
        - ''
        - '<yellow><line> <gray>рядок для видалення'
      feedback: '%prefix% <green>Вилучений рядок <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Установити дозвіл на використання цього елемента'
        - ''
        - '<yellow>[permission] <gray>дозвіл на встановлення, за замовчуванням немає'
      feedback:
        set: '%prefix% <green>Для використання цього предмета тепер потрібен дозвіл <yellow>%permission% <green>'
        removed: '%prefix% <green>Тепер для використання цього предмета не потрібен дозвіл'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Установіть час відновлення, щоб знову використати предмет'
        - ''
        - '<yellow>[ms] <gray>скільки часу минуло, перш ніж можна буде використовувати'
        - '<gray>елемент знову, за замовчуванням 0'
        - '<gray>Примітка: час відновлення встановлюється на основі cooldownid, інше'
        - '<gray> предмети з однаковим cooldownid мають однакове час відновлення'
        - '<gray>Примітка: час відновлення зберігається після виходу гравця з системи та перезавантаження сервера'
      feedback:
        set: '%prefix% <green>Цей предмет має час відновлення <yellow>%cooldown_seconds% <green>секунд'
        removed: '%prefix% <green>Цей предмет не має часу відновлення'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Установіть ідентифікатор часу відновлення для предмета'
        - ''
        - '<yellow>[id] <gray>спільний ідентифікатор часу відновлення'
        - '<gray>Примітка: час відновлення встановлюється на основі cooldownid, інше'
        - '<gray> предмети з однаковим cooldownid мають однакове час відновлення'
      feedback:
        set: '%prefix% <green>Цей предмет використовує ідентифікатор <yellow>%id% <green>для відновлення'
        removed: '%prefix% <green>Цей предмет використовує <yellow>за замовчуванням <green>id для відновлення'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Установіть повідомлення про час відновлення'
        - ''
        - '<yellow>[message] <gray>повідомлення, яке відображатиметься, коли предмет не можна використовувати'
        - '<gray>поки час відновлення активний'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Повідомлення зворотного зв’язку для відновлення встановлено як «<white>%msg%<green>», коли відновлення активне'
        removed: '%prefix% <green>Повідомлення зворотнього зв''язку для відновлення видалено'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Установіть тип повідомлення про відновлення'
        - ''
        - '<yellow>[type] <gray>chat або actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Повідомлення зворотнього зв’язку для відновлення встановлено як тип «<yellow>%type%<green>»'
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Установіть, скільки разів можна використовувати предмет'
        - ''
        - '<gray>Примітка: використовуйте <yellow>-1 <gray>для необмеженого використання'
      feedback:
        set: '%prefix% <green>Цей товар має <yellow>%uses% <green>використання до споживання'
        unlimited: '%prefix% <green>Цей товар має <yellow>необмежену кількість <green>використань'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Встановити максимальну кількість використань предмета'
        - ''
        - '<gray>Використовується в основному в естетичних цілях з'
        - '<gray>Дисплей використовує встановлено на true'
        - ''
        - '<gray>Примітка: використовуйте <yellow>-1 <gray>для необмеженого використання'
      feedback:
        set: '%prefix% <green>Цей предмет має <yellow>%uses% <green>макс. використання'
        unlimited: '%prefix% <green>Цей товар має <yellow>необмежену кількість <green>макс. використання'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Скористайтеся предметом під час останнього використання'
        - ''
        - '<gray>Примітка: коли true і предмет споживає'
        - '<gray> при останньому використанні, предмет знищується'
      feedback:
        set: '%prefix% <green>Предмет знищується після останнього використання'
        unset: '%prefix% <green>Елемент не знищується після останнього використання'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Візуально показати час відновлення, що залишився'
        - ''
        - '<gray>Коли true елемент показує анімацію, подібну до'
        - '<gray>анімація перезаряджання перлини Енду'
        - ''
        - '<gray>Примітка: на жаль, цей візуальний ефект також'
        - '<gray> стосується будь-якого товару такого ж типу'
      feedback:
        set: '%prefix% <green>Тепер предмет показує візуальне відновлення'
        unset: '%prefix% <green>Тепер предмет не показуватиме візуальне відновлення'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Показувати кількість використань, що залишилися'
        - ''
        - '<gray>Коли true додає рядок для опису'
        - '<gray>скільки використань залишилося'
        - ''
        - '<gray>Примітка: на жаль, цей візуальний ефект також'
        - '<gray> стосується будь-якого товару такого ж типу'
      feedback:
        set: '%prefix% <green>Тепер предмет показує кількість використаних ресурсів, що залишилися, і максимальне використання'
        unset: '%prefix% <green>Елемент більше не показує кількість залишків і максимального використання'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Встановлює дію (деякі дії)'
      - '<gray>активність може бути активована тригерами'
      - '<gray> можуть бути пов’язані з елементами (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- створити нову дію'
      - '<yellow>Open <id> <gray>- відкрити графічний інтерфейс для вибраної діяльності'
      - '<yellow>Delete <id> <gray>- видалити вибрану активність'
      - '<yellow>Clone <id> <new id><gray>- клонувати вибрану дію'
      - '<yellow>Rename <id> <new id><gray>- перейменувати вибрану дію'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Дії <gold>%id% <red>не існує'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Діяльність <gold>%id% <red>вже використовується'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Створити нову дію'
        - ''
        - '<yellow><new id> <gray>це ідентифікатор активності'
        - '<gray>id має починатися з літери та може бути буквено-цифровим'
        - '<gray>може також містити символ _'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>створено'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Перейменувати ідентифікатор активності'
        - ''
        - '<yellow><id> <gray>є поточним ідентифікатором активності'
        - '<yellow><new id> <gray> це новий ідентифікатор активності'
        - '<gray>id має починатися з літери та може бути буквено-цифровим'
        - '<gray>може також містити символ _'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>перейменовано <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Відкрийте графічний інтерфейс, щоб редагувати дію'
        - ''
        - '<yellow><id> <gray>ідентифікатор активності'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Видалити вибрану дію'
        - ''
        - '<yellow><id> <gray>ідентифікатор активності'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>видалено'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>Клонувати вибрану дію'
        - ''
        - '<yellow><id> <gray>це ідентифікатор вибраної діяльності'
        - '<yellow><clone id> <gray>ідентифікатор клону'
        - '<gray>id має починатися з літери та може бути буквено-цифровим'
        - '<gray>може також містити символ _'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>клоновано до <yellow>%clone_id%'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Установити використання, необхідне для вибраної діяльності'
        - ''
        - '<yellow><id> <gray>це ідентифікатор вибраної діяльності'
        - '<yellow><amount> <gray>кількість використань, споживаних активацією діяльності'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>споживання становить <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Додайте умову для активації активності'
        - ''
        - '<yellow><id> <gray>ідентифікатор активності'
        - '<yellow>[!] <gray>це "!" якщо ви хочете, щоб умова була зворотною'
        - '<yellow><conditiontype> <gray> це тип умови'
        - '<yellow>[condition info] <gray>це додаткова інформація, яка може знадобитися для типу умови'
      feedback: '%prefix% <green>Діяльність <yellow>%id% <green>додана умова <yellow>%condition%'
  consumeactions:
    description:
      - '<gradient:#A78BFA:gold><b>Встановлює дії, які виконуються, коли предмет споживається як їжа чи напої'
      - ''
      - '<yellow>Add <type> <action> <gray>- додати вибрану дію'
      - '<yellow>Set <line> <type> <action> <gray>- замінити дію на вибраному рядку'
      - '<yellow>Remove <line> <gray>- видалити дію на вибраному рядку'
      - '<yellow>Clear <gray>- видалити всі дії'
      - '<yellow>Permission [permission] <gray>- встановіть необхідний дозвіл для використання цього елемента'
      - '<yellow>Cooldown <ms> <gray>- встановіть час відновлення для повторного використання цього предмета'
      - '<yellow>Cooldownid [id] <gray>- встановити для цього використаний ідентифікатор часу відновлення'
      - '<yellow>Info <gray>- показати інформацію про дії з поточним елементом'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Додати вибрану дію'
        - ''
        - '<yellow><type> <gray>тип дії'
        - '<yellow><action> <gray>додаткова інформація для дії'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Додати вибрану дію у вибраний рядок'
        - ''
