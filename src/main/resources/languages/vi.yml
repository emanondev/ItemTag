generic:
  help:
    player-only: '<dark_red>[<red>ItemTag<dark_red>] <red>Lệnh chỉ dành cho người chơi'
    no-item-on-hand: '<dark_red>[<red>ItemTag<dark_red>] <red>Bạn cần cầm đồ trên tay'
    lack-permission: '<dark_red>[<red>ItemTag<dark_red>] <red>Bạn không có quyền %permission%'
    lack-permission-generic: '<dark_red>[<red>ItemTag<dark_red>] <red>Bạn không có quyền sử dụng lệnh này'
    prefix: '<dark_gray>[<gradient:#54acff:#A78BFA><bold>ItemTag</bold></gradient><dark_gray>]</dark_gray>'
    header-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <#A78BFA><bold>Trợ giúp</bold></#A78BFA>'
    header-sub-format: '<gradient:#54acff:#A78BFA><bold>%header%</bold></gradient> <dark_gray>»</dark_gray> <gradient:#A78BFA:#54acff><bold>%sub%</bold></gradient> <dark_gray>»</dark_gray> <#55d6ff><bold>Trợ giúp</#55d6ff>'
    command-format: '<gray>/%command%</gray> <#bad1ff>%sub%</#bad1ff> <#d7bbff>%params%</#d7bbff>'
    footer-format: '%prev_clickable% <#7E9CFD><b>Trợ giúp</b> [%page%/%max_page%]</#7E9CFD> %next_clickable%'
    next_text: ' <light_purple><b>><st>> ></st> '
    prev_text: ' <light_purple><b><st>< <</st>< '
    next_void: ' <dark_gray><b>><st>> ></st> '
    prev_void: ' <dark_gray><b><st>< <</st>< '
    next_hover: '<gold><b>Chuyển đến trang %target%'
    prev_hover: '<gold><b>Chuyển đến trang %target%'
  wrong-alias:
    wrong-flag: '%prefix% <red>Giá trị cờ sai! <dark_red>[<gold>di chuột vào đây<dark_red>]'
    wrong-action: '%prefix% <red>Loại hành động sai! <dark_red>[<gold>di chuột vào đây<dark_red>]'
    error-pre-hover: '<gradient:#A78BFA:gold><b>Bí danh:</b></gradient>'
    first_color: '<aqua>'
    second_color: '<yellow>'
itemtag:
  flag:
    description:
      - '<gradient:#A78BFA:gold><b>Chuyển đổi cờ tùy chỉnh trên mục'
      - ''
      - '<yellow><flag> <gray>tên cờ'
      - '<yellow>[true/false] <gray>giá trị cờ; nếu bỏ qua, đảo ngược giá trị hiện tại'
    params: '<flag> [true/false]'
    placeable:
      feedback:
        standard: '%prefix% <green>Có thể đặt vật phẩm.'
        custom: '%prefix% <green>Không thể đặt vật phẩm.'
        failed-place-attempt: '<dark_red>[<red>ItemTag<dark_red>] <red>Bạn không thể đặt mục này'
    usable:
      feedback:
        standard: '%prefix% <green>Sản phẩm có thể sử dụng được.'
        custom: '%prefix% <green>Không thể sử dụng vật phẩm này (Click chuột phải).'
    smelt:
      feedback:
        standard: '%prefix% <green>Sản phẩm có thể được nấu hoặc nấu chảy trong lò.'
        custom: '%prefix% <green>Sản phẩm không thể nấu hoặc nấu chảy trong lò.'
    furnacefuel:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể dùng làm nhiên liệu đốt lò.'
        custom: '%prefix% <green>Vật phẩm này không thể dùng làm nhiên liệu đốt lò.'
    recipeingredient:
      feedback:
        standard: '%prefix% <green>Sản phẩm có thể được sử dụng làm nguyên liệu cho công thức nấu ăn.'
        custom: '%prefix% <green>Không thể sử dụng vật phẩm này làm thành phần công thức.'
    enchantable:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể được phù phép.'
        custom: '%prefix% <green>Không thể phù phép vật phẩm.'
    renamable:
      feedback:
        standard: '%prefix% <green>Sản phẩm có thể được sử dụng trên đe.'
        custom: '%prefix% <green>Không thể sử dụng vật phẩm này trên đe.'
    grindable:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể được giải bùa bằng đá mài.'
        custom: '%prefix% <green>Vật phẩm không thể được giải mã bằng đá mài.'
    equipment:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể được trang bị.'
        custom: '%prefix% <green>Không thể trang bị vật phẩm này.'
    entityfood:
      feedback:
        standard: '%prefix% <green>Sản phẩm có thể dùng làm thức ăn cho động vật.'
        custom: '%prefix% <green>Sản phẩm không được dùng làm thức ăn cho động vật.'
    clickmove:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể được di chuyển trong kho.'
        custom: '%prefix% <green>Không thể di chuyển vật phẩm trong kho.'
    tradeable:
      feedback:
        standard: '%prefix% <green>Vật phẩm có thể được trao đổi với dân làng.'
        custom: '%prefix% <green>Vật phẩm này không thể trao đổi với dân làng.'
    smithing_table:
      feedback:
        standard: '%prefix% <green>Vật phẩm này có thể được sử dụng làm nguyên liệu cho bàn rèn.'
        custom: '%prefix% <green>Vật phẩm này không thể được sử dụng làm nguyên liệu cho bàn rèn.'
  actions:
    invalid-action:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' không phải là loại hợp lệ <dark_red>[<gold>di chuột vào đây<dark_red>]'
    invalid-actioninfo:
      message: '<dark_red>[<red>ItemTag<dark_red>] <red>''<gold>%error%<red>'' không phải là thông tin hợp lệ cho <gold>%action% <dark_red>[<gold>di chuột vào đây<dark_red>]'
    description:
      - '<gradient:#A78BFA:gold><b>Thiết lập các hành động được thực hiện khi sử dụng vật phẩm'
      - ''
      - '<yellow>Add <type> <action> <gray>- thêm hành động đã chọn'
      - '<yellow>Set <line> <type> <action> <gray>- thay thế hành động trên dòng đã chọn'
      - '<yellow>Remove <line> <gray>- xóa hành động trên dòng đã chọn'
      - '<yellow>Clear <gray>- xóa tất cả hành động'
      - '<yellow>Permission [permission] <gray>- đặt quyền cần thiết để sử dụng mục này'
      - '<yellow>Cooldown <ms> <gray>- đặt thời gian hồi chiêu để sử dụng lại vật phẩm này'
      - '<yellow>Cooldownid [id] <gray>- đặt id thời gian hồi chiêu đã sử dụng cho việc này'
      - '<yellow>Cooldownmsg [msg] <gray>- đặt phản hồi về thời gian hồi chiêu'
      - '<yellow>Cooldownmsgtype [type] <gray>- đặt loại phản hồi thời gian hồi chiêu (chat hoặc actionbar)'
      - '<yellow>Uses [amount] <gray>- đặt số lần vật phẩm này có thể được sử dụng'
      - '<yellow>Info <gray>- hiển thị thông tin về các hành động trên mục hiện tại'
    params: '[...]'
    add:
      params: 'add <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Thêm hành động đã chọn'
        - ''
        - '<yellow><type> <gray>loại hành động'
        - '<yellow><action> <gray>thông tin bổ sung cho hành động'
      feedback: '%prefix% <green>Đã thêm <yellow>%action%'
    addline:
      params: 'addline <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Thêm hành động đã chọn trên dòng đã chọn'
        - ''
        - '<yellow><line> <gray>dòng để thêm'
        - '<yellow><type> <gray>loại hành động'
        - '<yellow><action> <gray>thông tin bổ sung cho hành động'
      feedback: '%prefix% <green>Dòng <yellow>%line% <green>được thêm vào dưới dạng <yellow>%action%'
    set:
      params: 'set <line> <type> <action>'
      description:
        - '<gradient:#A78BFA:gold><b>Thay thế hành động trên dòng đã chọn'
        - ''
        - '<yellow><line> <gray>dòng cần thay thế'
        - '<yellow><type> <gray>loại hành động'
        - '<yellow><action> <gray>thông tin bổ sung cho hành động'
      feedback: '%prefix% <green>Dòng <yellow>%line% <green>đặt là <yellow>%action%'
    remove:
      params: 'remove <line>'
      description:
        - '<gradient:#A78BFA:gold><b>Xóa hành động trên dòng đã chọn'
        - ''
        - '<yellow><line> <gray>dòng cần xóa'
      feedback: '%prefix% <green>Đã xóa dòng <yellow>%line% <green>(<yellow>%action%<green>)'
    permission:
      params: 'permission [permission]'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt quyền sử dụng mục này'
        - ''
        - '<yellow>[permission] <gray>quyền được đặt, theo mặc định là không có'
      feedback:
        set: '%prefix% <green>Quyền <yellow>%permission% <green>hiện được yêu cầu để sử dụng mục này'
        removed: '%prefix% <green>Bây giờ không cần xin phép để sử dụng mục này'
    cooldown:
      params: 'cooldown [ms]'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt thời gian hồi chiêu để sử dụng lại vật phẩm'
        - ''
        - '<yellow>[ms] <gray>bao lâu mới có thể sử dụng được'
        - '<gray>mục đó lại, theo mặc định 0'
        - '<gray>Lưu ý: thời gian hồi chiêu được đặt dựa trên cooldownid, khác nhau'
        - '<gray> vật phẩm có cùng cooldownid có cùng thời gian hồi chiêu'
        - '<gray>Lưu ý: thời gian hồi chiêu được giữ nguyên khi người chơi đăng xuất và khởi động lại máy chủ'
      feedback:
        set: '%prefix% <green>Vật phẩm này có thời gian hồi chiêu là <yellow>%cooldown_seconds% <green>giây'
        removed: '%prefix% <green>Trang bị này không có thời gian hồi chiêu'
    cooldownid:
      params: 'cooldownid [id]'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt id thời gian hồi chiêu cho một vật phẩm'
        - ''
        - '<yellow>[id] <gray>số nhận dạng thời gian hồi chiêu được chia sẻ'
        - '<gray>Lưu ý: thời gian hồi chiêu được đặt dựa trên cooldownid, khác nhau'
        - '<gray> vật phẩm có cùng cooldownid có cùng thời gian hồi chiêu'
      feedback:
        set: '%prefix% <green>Vật phẩm này sử dụng ID <yellow>%id% <green>để hồi chiêu'
        removed: '%prefix% <green>Mục này sử dụng <yellow>mặc định <green>id cho thời gian hồi chiêu'
    cooldownmsg:
      description:
        - '<gradient:#A78BFA:gold><b>Đặt tin nhắn hồi chiêu'
        - ''
        - '<yellow>[message] <gray>thông báo hiển thị khi không thể sử dụng vật phẩm'
        - '<gray>trong khi thời gian hồi chiêu đang được kích hoạt'
      params: 'cooldownmsg [message]'
      feedback:
        set: '%prefix% <green>Thông báo phản hồi về thời gian hồi chiêu được đặt là ''<white>%msg%<green>'' khi thời gian hồi chiêu được kích hoạt'
        removed: '%prefix% <green>Thông báo phản hồi về thời gian hồi chiêu đã bị xóa'
    cooldownmsgtype:
      description:
        - '<gradient:#A78BFA:gold><b>Đặt loại tin nhắn thời gian hồi chiêu'
        - ''
        - '<yellow>[type] <gray>chat hoặc actionbar'
      params: 'cooldownmsgtype [type]'
      feedback:
        set: '%prefix% <green>Thông báo phản hồi về thời gian hồi chiêu được đặt ở loại ''<yellow>%type%<green>'''
    uses:
      params: 'uses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt số lần vật phẩm có thể được sử dụng'
        - ''
        - '<gray>Lưu ý: sử dụng <yellow>-1 <gray>không giới hạn số lần sử dụng'
      feedback:
        set: '%prefix% <green>Sản phẩm này có <yellow>%uses% <green>sử dụng trước khi tiêu thụ'
        unlimited: '%prefix% <green>Mục này có <yellow>không giới hạn <green>công dụng'
    maxuses:
      params: 'maxuses [amount]'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt số lần sử dụng tối đa cho vật phẩm'
        - ''
        - '<gray>Sử dụng chủ yếu cho mục đích thẩm mỹ với'
        - '<gray>Sử dụng hiển thị được đặt thành true'
        - ''
        - '<gray>Lưu ý: sử dụng <yellow>-1 <gray>không giới hạn số lần sử dụng'
      feedback:
        set: '%prefix% <green>Sản phẩm này có <yellow>%uses% <green>công dụng tối đa'
        unlimited: '%prefix% <green>Mục này có <yellow>không giới hạn <green>số lần sử dụng tối đa'
    consume:
      params: 'consume [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Tiêu thụ vật phẩm trong lần sử dụng cuối cùng'
        - ''
        - '<gray>Lưu ý: khi true và vật phẩm tiêu thụ'
        - '<gray> lần sử dụng cuối cùng, vật phẩm sẽ bị phá hủy'
      feedback:
        set: '%prefix% <green>Vật phẩm sẽ bị phá hủy khi sử dụng lần cuối'
        unset: '%prefix% <green>Vật phẩm không bị phá hủy khi sử dụng lần cuối'
    visualcooldown:
      params: 'visualcooldown [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Hiển thị thời gian hồi chiêu còn lại một cách trực quan'
        - ''
        - '<gray>Khi true mục hiển thị hoạt ảnh tương tự như'
        - '<gray>hiệu ứng hồi chiêu của ngọc Ender'
        - ''
        - '<gray>Lưu ý: Thật không may, hiệu ứng hình ảnh này cũng'
        - '<gray> áp dụng cho mọi mặt hàng cùng loại'
      feedback:
        set: '%prefix% <green>Bây giờ vật phẩm hiển thị thời gian hồi chiêu trực quan'
        unset: '%prefix% <green>Trang bị hiện tại sẽ không hiển thị thời gian hồi chiêu hình ảnh'
    displayuses:
      params: 'displayuses [true/false]'
      description:
        - '<gradient:#A78BFA:gold><b>Hiển thị số lần sử dụng còn lại'
        - ''
        - '<gray>Khi true thêm một dòng để mô tả'
        - '<gray>còn bao nhiêu công dụng'
        - ''
        - '<gray>Lưu ý: Thật không may, hiệu ứng hình ảnh này cũng'
        - '<gray> áp dụng cho mọi mặt hàng cùng loại'
      feedback:
        set: '%prefix% <green>Vật phẩm hiện hiển thị số lần sử dụng còn lại và tối đa'
        unset: '%prefix% <green>Vật phẩm không còn hiển thị số lần sử dụng còn lại và tối đa'
  activity:
    description:
      - '<gradient:#A78BFA:gold><b>Thiết lập một hoạt động (một số hành động)'
      - '<gray>một hoạt động có thể được kích hoạt bởi trình kích hoạt'
      - '<gray>trình kích hoạt có thể được liên kết với các mục (/it trigger)'
      - ''
      - '<yellow>Create <id> <gray>- tạo một hoạt động mới'
      - '<yellow>Open <id> <gray>- mở gui cho hoạt động đã chọn'
      - '<yellow>Delete <id> <gray>- xóa hoạt động đã chọn'
      - '<yellow>Clone <id> <new id><gray>- sao chép hoạt động đã chọn'
      - '<yellow>Rename <id> <new id><gray>- đổi tên hoạt động đã chọn'
    params: '[...]'
    feedback:
      invalid_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Hoạt động <gold>%id% <red>không tồn tại'
      already_used_activity_id: '<dark_red>[<red>ItemTag<dark_red>] <red>Hoạt động <gold>%id% <red>đã được sử dụng'
    create:
      params: 'create <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Tạo hoạt động mới'
        - ''
        - '<yellow><new id> <gray>là id của hoạt động'
        - '<gray>id phải bắt đầu bằng một chữ cái và có thể là chữ và số'
        - '<gray>cũng có thể chứa ký hiệu _'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>đã tạo'
    rename:
      params: 'rename <id> <new id>'
      description:
        - '<gradient:#A78BFA:gold><b>Đổi tên id hoạt động'
        - ''
        - '<yellow><id> <gray>là id hiện tại của hoạt động'
        - '<yellow><new id> <gray>là id mới của hoạt động'
        - '<gray>id phải bắt đầu bằng một chữ cái và có thể là chữ và số'
        - '<gray>cũng có thể chứa ký hiệu _'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>đã đổi tên <yellow>%new_id%'
    open:
      params: 'open <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Mở gui để chỉnh sửa hoạt động'
        - ''
        - '<yellow><id> <gray>là id của hoạt động'
    delete:
      params: 'delete <id>'
      description:
        - '<gradient:#A78BFA:gold><b>Xóa hoạt động đã chọn'
        - ''
        - '<yellow><id> <gray>là id của hoạt động'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>đã xóa'
    clone:
      params: 'clone <id> <clone id>'
      description:
        - '<gradient:#A78BFA:gold><b>Sao chép hoạt động đã chọn'
        - ''
        - '<yellow><id> <gray>là ID của hoạt động đã chọn'
        - '<yellow><clone id> <gray>là id của bản sao'
        - '<gray>id phải bắt đầu bằng một chữ cái và có thể là chữ và số'
        - '<gray>cũng có thể chứa ký hiệu _'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>được sao chép thành <yellow>%clone_id%'
    setconsumes:
      params: 'setconsumes <id> <amount>'
      description:
        - '<gradient:#A78BFA:gold><b>Đặt mục đích sử dụng cần thiết cho hoạt động đã chọn'
        - ''
        - '<yellow><id> <gray>là ID của hoạt động đã chọn'
        - '<yellow><amount> <gray>số lượng sử dụng được sử dụng khi kích hoạt hoạt động'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>sử dụng mức tiêu thụ là <yellow>%amount%'
    addcondition:
      params: 'addcondition <id> [!]<conditiontype> [condition info]'
      description:
        - '<gradient:#A78BFA:gold><b>Thêm điều kiện để kích hoạt hoạt động'
        - ''
        - '<yellow><id> <gray>là id của hoạt động'
        - '<yellow>[!] <gray>là ''!'' nếu bạn muốn điều kiện được đảo ngược'
        - '<yellow><conditiontype> <gray>là loại tình trạng'
        - '<yellow>[condition info] <gray>là thông tin bổ sung mà loại điều kiện có thể cần'
      feedback: '%prefix% <green>Hoạt động <yellow>%id% <green>điều kiện bổ sung <yellow>%condition%'
  consumeactions:
    description:
